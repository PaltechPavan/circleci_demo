version: 2.1

orbs:
  aws-cli: circleci/aws-cli@5.4.1

jobs:

  # =========================================================
  # FEATURE / PULL REQUEST VALIDATION
  # =========================================================

  validate-models:
    docker:
      - image: cimg/python:3.11

    environment:
      DBT_PROFILES_DIR: .

    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================

      - checkout

      # =====================================================
      # 2. VERIFY CHECKOUT
      # =====================================================

      - run:
          name: Verify Checkout and Commit
          command: |
            echo "========================================"
            echo "Current Branch"
            echo "========================================"

            git branch --show-current

            echo ""
            echo "========================================"
            echo "Current Commit"
            echo "========================================"

            git log -1 --oneline

            echo ""
            echo "========================================"
            echo "Git Status"
            echo "========================================"

            git status

      # =====================================================
      # 3. SHOW PROJECT FILES
      # =====================================================

      - run:
          name: Show Project Files
          command: |
            echo "========================================"
            echo "Project Files"
            echo "========================================"

            find . -maxdepth 3 -type f | sort

      # =====================================================
      # 4. INSTALL DEPENDENCIES
      # =====================================================

      - run:
          name: Install Dependencies
          command: |
            echo "========================================"
            echo "Python Version"
            echo "========================================"

            python --version

            echo ""
            echo "========================================"
            echo "Pip Version"
            echo "========================================"

            pip --version

            echo ""
            echo "========================================"
            echo "Installing Dependencies"
            echo "========================================"

            pip install --upgrade pip

            pip install -r requirements.txt

      # =====================================================
      # 5. VERIFY DBT
      # =====================================================

      - run:
          name: Verify dbt Installation
          command: |
            echo "========================================"
            echo "dbt Version"
            echo "========================================"

            dbt --version

      # =====================================================
      # 6. INSTALL DBT PACKAGES
      # =====================================================

      - run:
          name: dbt Dependencies
          command: |
            echo "========================================"
            echo "Running dbt deps"
            echo "========================================"

            dbt deps

      # =====================================================
      # 7. SHOW DBT PROJECT CONFIGURATION
      # =====================================================

      - run:
          name: Show dbt Configuration
          command: |
            echo "========================================"
            echo "dbt Project"
            echo "========================================"

            cat dbt_project.yml

            echo ""
            echo "========================================"
            echo "dbt Profile"
            echo "========================================"

            cat profiles.yml

      # =====================================================
      # 8. DBT PARSE
      # =====================================================

      - run:
          name: dbt Parse
          command: |
            echo "========================================"
            echo "Running dbt parse"
            echo "========================================"

            dbt parse

      # =====================================================
      # 9. SHOW MODELS
      #
      # This tells us exactly which models dbt sees.
      # =====================================================

      - run:
          name: Check dbt Models
          command: |
            echo "========================================"
            echo "All dbt Models"
            echo "========================================"

            dbt ls --resource-type model

            echo ""
            echo "========================================"
            echo "Model Names Only"
            echo "========================================"

            dbt ls \
              --resource-type model \
              --output name

      # =====================================================
      # 10. SHOW EXACT MODEL CONTENT
      # =====================================================

      - run:
          name: Show Model Files Being Tested
          command: |
            echo "========================================"
            echo "Commit Being Tested"
            echo "========================================"

            git log -1 --oneline

            echo ""
            echo "========================================"
            echo "Appointments Model"
            echo "========================================"

            if [ -f models/appointments.sql ]; then
              cat models/appointments.sql
            else
              echo "appointments.sql not found"
            fi

            echo ""
            echo "========================================"
            echo "Patient Model"
            echo "========================================"

            if [ -f models/patient.sql ]; then
              cat models/patient.sql
            else
              echo "patient.sql not found"
            fi

      # =====================================================
      # 11. SQL LINTING
      # =====================================================

      - run:
          name: SQL Linting
          command: |
            echo "========================================"
            echo "Running SQLFluff"
            echo "========================================"

            sqlfluff lint models/

      # =====================================================
      # 12. AWS OIDC
      # =====================================================

      - aws-cli/setup:
          role_arn: "arn:aws:iam::008300323897:role/circle-ci-oidc-role"
          region: "ap-south-1"

      # =====================================================
      # 13. VERIFY AWS IDENTITY
      # =====================================================

      - run:
          name: Verify AWS Identity
          command: |
            echo "========================================"
            echo "AWS Identity"
            echo "========================================"

            aws sts get-caller-identity

      # =====================================================
      # 14. VERIFY CI DATABASE
      # =====================================================

      - run:
          name: Verify CI Athena Database
          command: |
            echo "========================================"
            echo "Checking CI Athena Database"
            echo "========================================"

            aws athena start-query-execution \
              --query-string "SHOW DATABASES" \
              --work-group primary \
              --query-execution-context Database=awsdatacatalog \
              --result-configuration OutputLocation=s3://umed-practice-12345-raw/practice-ci/ \
              > /tmp/query.json

            cat /tmp/query.json

      # =====================================================
      # 15. CI DBT BUILD
      #
      # IMPORTANT:
      # This currently builds the models selected by dbt.
      #
      # Target = dev_ci
      # Database = umed_ci_ehr_db
      # =====================================================

      - run:
          name: CI dbt Build
          command: |
            echo "========================================"
            echo "Running dbt Build"
            echo "========================================"

            echo "Target: dev_ci"
            echo "Database: umed_ci_ehr_db"

            echo ""

            dbt build \
              --target dev_ci \
              --select "resource_type:model"


  # =========================================================
  # MAIN BRANCH DEPLOYMENT
  #
  # CURRENTLY YOUR EXISTING S3 DEPLOYMENT
  #
  # Later:
  # main → Docker → ECR → deployment
  # =========================================================

  model-deploy:
    docker:
      - image: cimg/aws:2025.01

    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================

      - checkout

      # =====================================================
      # 2. AWS OIDC
      # =====================================================

      - aws-cli/setup:
          role_arn: "arn:aws:iam::008300323897:role/circle-ci-oidc-role"
          region: "ap-south-1"

      # =====================================================
      # 3. VERIFY AWS
      # =====================================================

      - run:
          name: Verify AWS Identity
          command: |
            echo "Checking AWS identity..."

            aws sts get-caller-identity

      # =====================================================
      # 4. SHOW MODELS
      # =====================================================

      - run:
          name: Show Models
          command: |
            echo "Models in GitHub:"

            find models -type f -print

      # =====================================================
      # 5. SYNC MODELS TO S3
      # =====================================================

      - run:
          name: Sync Models to S3
          command: |
            echo "Synchronizing models with S3..."

            aws s3 sync \
              models/ \
              s3://dummu-circleci-s3-bucket/models/ \
              --delete

      # =====================================================
      # 6. VERIFY S3
      # =====================================================

      - run:
          name: Verify S3 Models
          command: |
            echo "Models currently in S3:"

            aws s3 ls \
              s3://dummu-circleci-s3-bucket/models/


# ===========================================================
# WORKFLOWS
# ===========================================================

workflows:

  # =========================================================
  # FEATURE / PR VALIDATION
  # =========================================================

  feature-validation:
    jobs:

      - validate-models:
          filters:
            branches:
              ignore:
                - main


  # =========================================================
  # MAIN DEPLOYMENT
  # =========================================================

  deploy:
    jobs:

      - model-deploy:
          filters:
            branches:
              only:
                - main