version: 2.1

orbs:
  python: circleci/python@3.1.0
  aws-cli: circleci/aws-cli@5.2.0

# ============================================================
# REUSABLE COMMANDS
# ============================================================

commands:

  install-dependencies:
    description: Install Python and dbt dependencies with Poetry
    steps:
      - checkout

      - run:
          name: Configure Poetry
          command: |
            poetry config virtualenvs.in-project true

      - python/install-packages:
          pkg-manager: poetry
          args: --with dev

  configure-aws-oidc:
    description: Configure AWS credentials using CircleCI OIDC
    steps:
      - aws-cli/setup:
          role_arn: $AWS_ROLE_ARN
          region: $AWS_REGION

      - run:
          name: Verify AWS identity
          command: |
            aws sts get-caller-identity

  login-to-ecr:
    description: Login to Amazon ECR
    steps:
      - run:
          name: Login to ECR
          command: |
            aws ecr get-login-password \
              --region "$AWS_REGION" |
              docker login \
                --username AWS \
                --password-stdin \
                "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

  run-ecs-task:
    description: >
      Register a new task-definition revision pointing at the image just built,
      run it as a one-off ECS Fargate task, and fail the build if dbt fails.
      ECR repositories here are IMAGE_TAG_MUTABILITY=IMMUTABLE, so the
      registered task definition can never just reference ":latest" — each
      run gets its own revision pinned to the exact tag pushed this build.
    parameters:
      cluster:
        type: string
      task-definition-family:
        type: string
      ecr-repository-env-var:
        type: string
      image-tag:
        type: string
      subnet-ids:
        type: string
      security-group-id:
        type: string
      public-ip-status:
        type: string
        default: DISABLED

    steps:
      - run:
          name: Run dbt on ECS Fargate (<<parameters.task-definition-family>>)
          command: |
            IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${<<parameters.ecr-repository-env-var>>}:<<parameters.image-tag>>"

            NEW_TASK_DEF_JSON=$(aws ecs describe-task-definition \
              --task-definition "<<parameters.task-definition-family>>" \
              --query 'taskDefinition' | \
              jq --arg IMAGE "$IMAGE_URI" \
                '.containerDefinitions[0].image = $IMAGE
                 | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                       .compatibilities, .registeredAt, .registeredBy)')

            NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
              --cli-input-json "$NEW_TASK_DEF_JSON" \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text)

            echo "Registered task definition: ${NEW_TASK_DEF_ARN}"
            echo "Image: ${IMAGE_URI}"

            TASK_ARN=$(aws ecs run-task \
              --cluster "<<parameters.cluster>>" \
              --task-definition "$NEW_TASK_DEF_ARN" \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[<<parameters.subnet-ids>>],securityGroups=[<<parameters.security-group-id>>],assignPublicIp=<<parameters.public-ip-status>>}" \
              --query 'tasks[0].taskArn' \
              --output text)

            if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
              echo "ecs run-task did not return a task ARN"
              exit 1
            fi

            echo "Started task: ${TASK_ARN}"

            aws ecs wait tasks-stopped \
              --cluster "<<parameters.cluster>>" \
              --tasks "$TASK_ARN"

            EXIT_CODE=$(aws ecs describe-tasks \
              --cluster "<<parameters.cluster>>" \
              --tasks "$TASK_ARN" \
              --query 'tasks[0].containers[0].exitCode' \
              --output text)

            echo "dbt task exit code: ${EXIT_CODE}"

            if [ "$EXIT_CODE" != "0" ]; then
              echo "dbt run failed — check CloudWatch Logs for this task's log stream"
              exit 1
            fi


# ============================================================
# JOBS
# ============================================================

jobs:

  # ----------------------------------------------------------
  # QA — main → build image → QA ECR — NON-PROD AWS ACCOUNT
  # ----------------------------------------------------------
  build-push-qa:
    machine:
      image: ubuntu-2204:current

    steps:
      - checkout
      - configure-aws-oidc
      - login-to-ecr

      - run:
          name: Build and push QA image
          command: |
            IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${QA_ECR_REPOSITORY}"
            IMAGE_TAG="${CIRCLE_SHA1}-${CIRCLE_BUILD_NUM}"

            docker build \
              --tag "${IMAGE_URI}:${IMAGE_TAG}" \
              .

            docker push \
              "${IMAGE_URI}:${IMAGE_TAG}"

            echo "QA image:"
            echo "${IMAGE_URI}:${IMAGE_TAG}"

      - run-ecs-task:
          cluster: ecs-qa
          task-definition-family: qa-task-defintion
          ecr-repository-env-var: QA_ECR_REPOSITORY
          image-tag: ${CIRCLE_SHA1}-${CIRCLE_BUILD_NUM}
          subnet-ids: $SUBNET_IDS
          security-group-id: $SECURITY_GROUP_ID
          public-ip-status: $PUBLIC_IP_STATUS


  # ----------------------------------------------------------
  # UAT — RC tag → manual approval → build → UAT ECR
  # ----------------------------------------------------------
  build-push-uat:
    machine:
      image: ubuntu-2204:current

    steps:
      - checkout
      - configure-aws-oidc
      - login-to-ecr

      - run:
          name: Build and push UAT image
          command: |
            IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${UAT_ECR_REPOSITORY}"
            IMAGE_TAG="${CIRCLE_TAG}-${CIRCLE_BUILD_NUM}"

            echo "Release: ${CIRCLE_TAG}"

            docker build \
              --tag "${IMAGE_URI}:${IMAGE_TAG}" \
              .

            docker push \
              "${IMAGE_URI}:${IMAGE_TAG}"

            echo "UAT image:"
            echo "${IMAGE_URI}:${IMAGE_TAG}"

      - run-ecs-task:
          cluster: ecs-uat
          task-definition-family: uat-task-definition
          ecr-repository-env-var: UAT_ECR_REPOSITORY
          image-tag: ${CIRCLE_TAG}-${CIRCLE_BUILD_NUM}
          subnet-ids: $SUBNET_IDS
          security-group-id: $SECURITY_GROUP_ID
          public-ip-status: $PUBLIC_IP_STATUS


  # ----------------------------------------------------------
  # PROD — RC tag → manual approval → build → PROD ECR
  # ----------------------------------------------------------
  build-push-prod:
    machine:
      image: ubuntu-2204:current

    steps:
      - checkout
      - configure-aws-oidc
      - login-to-ecr

      - run:
          name: Build and push PROD image
          command: |
            IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${PROD_ECR_REPOSITORY}"
            IMAGE_TAG="${CIRCLE_TAG}-${CIRCLE_BUILD_NUM}"

            echo "Release: ${CIRCLE_TAG}"

            docker build \
              --tag "${IMAGE_URI}:${IMAGE_TAG}" \
              .

            docker push \
              "${IMAGE_URI}:${IMAGE_TAG}"

            echo "PROD image:"
            echo "${IMAGE_URI}:${IMAGE_TAG}"

      - run-ecs-task:
          cluster: ecs-prod
          task-definition-family: prod-task-definition
          ecr-repository-env-var: PROD_ECR_REPOSITORY
          image-tag: ${CIRCLE_TAG}-${CIRCLE_BUILD_NUM}
          subnet-ids: $SUBNET_IDS
          security-group-id: $SECURITY_GROUP_ID
          public-ip-status: $PUBLIC_IP_STATUS


  # ============================================================
  # DAILY PROD DBT RUN
  # ============================================================
  # This job is triggered only by the CircleCI scheduled workflow.
  #
  # It does NOT:
  #   - Build a Docker image
  #   - Push an image to ECR
  #   - Run QA
  #   - Run UAT
  #   - Create a release tag
  #
  # It simply runs the existing PROD ECS task definition.
  # ============================================================
  run-prod-daily:
    machine:
      image: ubuntu-2204:current

    steps:
      - configure-aws-oidc

      - run:
          name: Run daily dbt job on PROD ECS
          command: |

            echo "=========================================="
            echo "Starting Daily PROD dbt ECS Task"
            echo "=========================================="

            echo "Cluster:"
            echo "ecs-prod"

            echo "Task Definition:"
            echo "prod-task-definition"

            # ------------------------------------------------
            # Start the existing PROD ECS task definition
            # ------------------------------------------------
            TASK_ARN=$(aws ecs run-task \
              --cluster ecs-prod \
              --task-definition prod-task-definition \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_IDS],securityGroups=[$SECURITY_GROUP_ID],assignPublicIp=$PUBLIC_IP_STATUS}" \
              --query 'tasks[0].taskArn' \
              --output text)

            if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
              echo "ERROR: ECS run-task did not return a task ARN"
              exit 1
            fi

            echo "Started PROD ECS task:"
            echo "${TASK_ARN}"

            # ------------------------------------------------
            # Wait for ECS task to finish
            # ------------------------------------------------
            echo "Waiting for PROD ECS task to finish..."

            aws ecs wait tasks-stopped \
              --cluster ecs-prod \
              --tasks "$TASK_ARN"

            # ------------------------------------------------
            # Get container exit code
            # ------------------------------------------------
            EXIT_CODE=$(aws ecs describe-tasks \
              --cluster ecs-prod \
              --tasks "$TASK_ARN" \
              --query 'tasks[0].containers[0].exitCode' \
              --output text)

            echo "=========================================="
            echo "PROD dbt Exit Code: ${EXIT_CODE}"
            echo "=========================================="

            # ------------------------------------------------
            # Fail CircleCI if dbt/ECS container failed
            # ------------------------------------------------
            if [ "$EXIT_CODE" != "0" ]; then
              echo "ERROR: Daily PROD dbt execution failed."
              echo "Check the ECS task and CloudWatch Logs."
              exit 1
            fi

            echo "Daily PROD dbt execution completed successfully."


# ============================================================
# WORKFLOWS
# ============================================================

workflows:

  # ==========================================================
  # QA WORKFLOW
  # ==========================================================
  qa:
    jobs:
      - build-push-qa:
          context: us-dbt
          filters:
            branches:
              only:
                - main
            tags:
              ignore: /.*/


  # ==========================================================
  # RELEASE CANDIDATE WORKFLOW
  # ==========================================================
  release-candidate:
    jobs:

      - approve-uat:
          type: approval
          filters: &rc-tag-only
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+-rc-\d+$/

      - build-push-uat:
          requires:
            - approve-uat
          context: us-dbt
          filters:
            <<: *rc-tag-only

      - approve-prod:
          type: approval
          requires:
            - build-push-uat
          filters:
            <<: *rc-tag-only

      - build-push-prod:
          requires:
            - approve-prod
          context: us-dbt
          filters:
            <<: *rc-tag-only


  # ==========================================================
  # DAILY PROD DBT WORKFLOW
  # ==========================================================
  # Runs every day at 02:00 UTC.
  #
  # 02:00 UTC = 07:30 AM IST
  #
  # This workflow ONLY runs:
  #
  #     run-prod-daily
  #
  # It does not trigger QA, UAT or release-candidate workflows.
  # ==========================================================
  daily-prod:
    triggers:
      - schedule:
          cron: "30 5 * * *"
          filters:
            branches:
              only:
                - main

    jobs:

      - run-prod-daily:
          context: us-dbt