version: 2.1

orbs:
  aws-cli: circleci/aws-cli@5.4.1

jobs:

  # =========================================================
  # 1. FEATURE / PR VALIDATION
  # =========================================================

  validate-models:
    docker:
      - image: cimg/python:3.11

    environment:
      DBT_PROFILES_DIR: .

    steps:

      # -------------------------------------------------------
      # Checkout feature branch
      # -------------------------------------------------------

      - checkout

      # -------------------------------------------------------
      # Install dbt + SQLFluff
      # -------------------------------------------------------

      - run:
          name: Install Dependencies
          command: |
            python --version
            pip --version

            pip install --upgrade pip
            pip install -r requirements.txt

      # -------------------------------------------------------
      # Install dbt packages
      # -------------------------------------------------------

      - run:
          name: dbt Dependencies
          command: |
            dbt deps

      # -------------------------------------------------------
      # dbt parsing
      # -------------------------------------------------------

      - run:
          name: dbt Parse
          command: |
            dbt parse

      # -------------------------------------------------------
      # SQL linting
      # -------------------------------------------------------

      - run:
          name: SQL Linting
          command: |
            sqlfluff lint models/

      # -------------------------------------------------------
      # AWS authentication
      # -------------------------------------------------------

      - aws-cli/setup:
          role_arn: "arn:aws:iam::008300323897:role/circle-ci-oidc-role"
          region: "ap-south-1"

      # -------------------------------------------------------
      # Verify AWS
      # -------------------------------------------------------

      - run:
          name: Verify AWS Identity
          command: |
            aws sts get-caller-identity

      # -------------------------------------------------------
      # Slim CI - temporary placeholder
      # -------------------------------------------------------

      - run:
          name: Slim CI
          command: |
            echo "Slim CI validation will run here"
            echo "CI database: umed_ci_ehr_db"


  # =========================================================
  # 2. EXISTING MAIN DEPLOYMENT
  # =========================================================

  model-deploy:
    docker:
      - image: cimg/aws:2025.01

    steps:

      - checkout

      - aws-cli/setup:
          role_arn: "arn:aws:iam::008300323897:role/circle-ci-oidc-role"
          region: "ap-south-1"

      - run:
          name: Verify AWS Identity
          command: |
            echo "Checking AWS identity..."
            aws sts get-caller-identity

      - run:
          name: Show Models
          command: |
            echo "Models in GitHub:"
            find models -type f -print

      - run:
          name: Sync Models to S3
          command: |
            echo "Synchronizing models with S3..."

            aws s3 sync \
              models/ \
              s3://dummu-circleci-s3-bucket/models/ \
              --delete

      - run:
          name: Verify S3 Models
          command: |
            echo "Models currently in S3:"

            aws s3 ls \
              s3://dummu-circleci-s3-bucket/models/


# =========================================================
# WORKFLOWS
# =========================================================

workflows:

  # ---------------------------------------------------------
  # FEATURE / PR
  # ---------------------------------------------------------

  feature-validation:
    jobs:

      - validate-models:
          filters:
            branches:
              ignore:
                - main


  # ---------------------------------------------------------
  # MAIN
  # ---------------------------------------------------------

  deploy:
    jobs:

      - model-deploy:
          filters:
            branches:
              only:
                - main