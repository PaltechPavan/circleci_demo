version: 2.1

orbs:
  aws-cli: circleci/aws-cli@5.4.1

jobs:

  # =========================================================
  # FEATURE / PULL REQUEST VALIDATION
  # =========================================================

  validate-models:
    docker:
      - image: cimg/python:3.11

    environment:
      DBT_PROFILES_DIR: .

    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================

      - checkout

      # =====================================================
      # 2. VERIFY CHECKOUT AND COMMIT
      # =====================================================

      - run:
          name: Verify Checkout and Commit
          command: |
            echo "========================================"
            echo "Current Branch"
            echo "========================================"

            git branch --show-current

            echo ""
            echo "========================================"
            echo "Current Commit"
            echo "========================================"

            git log -1 --oneline

            echo ""
            echo "========================================"
            echo "Git Status"
            echo "========================================"

            git status

      # =====================================================
      # 3. SHOW PROJECT FILES
      # =====================================================

      - run:
          name: Show Project Files
          command: |
            echo "========================================"
            echo "Project Files"
            echo "========================================"

            find . -maxdepth 3 -type f | sort

      # =====================================================
      # 4. INSTALL DEPENDENCIES
      # =====================================================

      - run:
          name: Install Dependencies
          command: |
            echo "========================================"
            echo "Python Version"
            echo "========================================"

            python --version

            echo ""
            echo "========================================"
            echo "Installing Dependencies"
            echo "========================================"

            pip install --upgrade pip

            pip install -r requirements.txt

      # =====================================================
      # 5. VERIFY DBT
      # =====================================================

      - run:
          name: Verify dbt Installation
          command: |
            echo "========================================"
            echo "dbt Version"
            echo "========================================"

            dbt --version

      # =====================================================
      # 6. DBT DEPENDENCIES
      # =====================================================

      - run:
          name: dbt Dependencies
          command: |
            echo "========================================"
            echo "Running dbt deps"
            echo "========================================"

            dbt deps

      # =====================================================
      # 7. SHOW DBT CONFIGURATION
      # =====================================================

      - run:
          name: Show dbt Configuration
          command: |
            echo "========================================"
            echo "dbt Project"
            echo "========================================"

            cat dbt_project.yml

            echo ""
            echo "========================================"
            echo "dbt Profile"
            echo "========================================"

            cat profiles.yml

      # =====================================================
      # 8. DBT PARSE
      # =====================================================

      - run:
          name: dbt Parse
          command: |
            echo "========================================"
            echo "Running dbt parse"
            echo "========================================"

            dbt parse

      # =====================================================
      # 9. CHECK DBT MODELS
      # =====================================================

      - run:
          name: Check dbt Models
          command: |
            echo "========================================"
            echo "Available dbt Models"
            echo "========================================"

            dbt ls \
              --resource-type model \
              --output name

      # =====================================================
      # 10. SHOW MODEL CONTENT
      # =====================================================

      - run:
          name: Show Model Files
          command: |
            echo "========================================"
            echo "Appointments Model"
            echo "========================================"

            cat models/appointments.sql

            echo ""
            echo "========================================"
            echo "Patient Model"
            echo "========================================"

            cat models/patient.sql

      # =====================================================
      # 11. SQL LINTING
      # =====================================================

      - run:
          name: SQL Linting
          command: |
            echo "========================================"
            echo "Running SQLFluff"
            echo "========================================"

            sqlfluff lint models/

      # =====================================================
      # 12. AWS OIDC
      # =====================================================

      - aws-cli/setup:
          role_arn: "arn:aws:iam::008300323897:role/circle-ci-oidc-role"
          region: "ap-south-1"

      # =====================================================
      # 13. VERIFY AWS IDENTITY
      # =====================================================

      - run:
          name: Verify AWS Identity
          command: |
            echo "========================================"
            echo "AWS Identity"
            echo "========================================"

            aws sts get-caller-identity

      # =====================================================
      # 14. ACTUAL CI DBT RUN
      #
      # This is NOT a placeholder.
      #
      # It runs the models against:
      #
      # target: dev_ci
      # database: umed_ci_ehr_db
      #
      # =====================================================

      - run:
          name: CI dbt Run
          command: |
            echo "========================================"
            echo "CI dbt Run"
            echo "========================================"

            echo "Target: dev_ci"
            echo "Database: umed_ci_ehr_db"

            echo ""
            echo "========================================"
            echo "Running Appointments Model"
            echo "========================================"

            dbt run \
              --target dev_ci \
              --select appointments \
              --no-partial-parse

            echo ""
            echo "========================================"
            echo "Running Patient Model"
            echo "========================================"

            dbt run \
              --target dev_ci \
              --select patient \
              --no-partial-parse

            echo ""
            echo "========================================"
            echo "CI dbt Run Completed"
            echo "========================================"


  # =========================================================
  # MAIN BRANCH DEPLOYMENT
  #
  # Current:
  # main → S3
  #
  # Later:
  # main → Docker → ECR → ECS/Fargate
  # =========================================================

  model-deploy:
    docker:
      - image: cimg/aws:2025.01

    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================

      - checkout

      # =====================================================
      # 2. AWS OIDC
      # =====================================================

      - aws-cli/setup:
          role_arn: "arn:aws:iam::008300323897:role/circle-ci-oidc-role"
          region: "ap-south-1"

      # =====================================================
      # 3. VERIFY AWS
      # =====================================================

      - run:
          name: Verify AWS Identity
          command: |
            echo "========================================"
            echo "AWS Identity"
            echo "========================================"

            aws sts get-caller-identity

      # =====================================================
      # 4. SHOW MODELS
      # =====================================================

      - run:
          name: Show Models
          command: |
            echo "========================================"
            echo "Models in GitHub"
            echo "========================================"

            find models -type f -print

      # =====================================================
      # 5. SYNC MODELS TO S3
      # =====================================================

      - run:
          name: Sync Models to S3
          command: |
            echo "========================================"
            echo "Synchronizing Models with S3"
            echo "========================================"

            aws s3 sync \
              models/ \
              s3://dummu-circleci-s3-bucket/models/ \
              --delete

      # =====================================================
      # 6. VERIFY S3
      # =====================================================

      - run:
          name: Verify S3 Models
          command: |
            echo "========================================"
            echo "Models Currently in S3"
            echo "========================================"

            aws s3 ls \
              s3://dummu-circleci-s3-bucket/models/


# ===========================================================
# WORKFLOWS
# ===========================================================

workflows:

  # =========================================================
  # FEATURE / PR VALIDATION
  # =========================================================

  feature-validation:
    jobs:

      - validate-models:
          filters:
            branches:
              ignore:
                - main


  # =========================================================
  # MAIN DEPLOYMENT
  # =========================================================

  deploy:
    jobs:

      - model-deploy:
          filters:
            branches:
              only:
                - main