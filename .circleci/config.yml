version: 2.1

orbs:
  aws-cli: circleci/aws-cli@5.4.1

jobs:
  aws-oidc-test:
    docker:
      - image: cimg/aws:2025.01

    steps:
      - checkout

      - aws-cli/setup:
          role_arn: "arn:aws:iam::008300323897:role/circle-ci-oidc-role"
          region: "ap-south-1"

      - run:
          name: Verify AWS Identity
          command: |
            echo "Checking AWS identity..."
            aws sts get-caller-identity

      - run:
          name: Upload models to S3
          command: |
            echo "Uploading models to S3..."
            aws s3 sync models/ s3://dummy-circleci-s3-bucket/models/

workflows:
  oidc-test:
    jobs:
      - aws-oidc-test:
          filters:
            branches:
              only:
                - main