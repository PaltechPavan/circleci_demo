version: 2.1


# ============================================================
# ORBS
# ============================================================

orbs:

  python: circleci/python@3.1.0

  aws-cli: circleci/aws-cli@5.2.0


# ============================================================
# REUSABLE COMMANDS
# ============================================================

commands:


  # ==========================================================
  # Install Dependencies
  # ==========================================================

  install-dependencies:

    steps:

      - run:

          name: Install Dependencies

          command: |

            echo "=========================================="
            echo "Installing dependencies"
            echo "=========================================="

            python --version

            pip --version

            pip install --upgrade pip


            if [ -f requirements.txt ]; then

              pip install -r requirements.txt

            fi


            echo "Dependencies installed successfully."


  # ==========================================================
  # Configure AWS OIDC
  # ==========================================================

  configure-aws-oidc:

    steps:

      - aws-cli/setup:

          role_arn: ${AWS_ROLE_ARN}

          region: ${AWS_REGION}


      - run:

          name: Verify AWS Identity

          command: |

            echo "=========================================="
            echo "AWS Identity"
            echo "=========================================="

            aws sts get-caller-identity


  # ==========================================================
  # Login to ECR
  # ==========================================================

  login-to-ecr:

    steps:

      - run:

          name: Login to Amazon ECR

          command: |

            echo "=========================================="
            echo "Logging in to Amazon ECR"
            echo "=========================================="


            aws ecr get-login-password \
              --region "${AWS_REGION}" \
              | docker login \
                  --username AWS \
                  --password-stdin \
                  "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"


            echo "ECR login successful."


  # ==========================================================
  # Run ECS Task
  # ==========================================================

  run-ecs-task:

    parameters:

      cluster-name:

        type: string


      task-definition-family:

        type: string


      ecr-repository:

        type: string


      image-tag:

        type: string


      dbt-run-mode:

        type: string


      subnet-ids:

        type: string


      security-group-id:

        type: string


    steps:


      # ------------------------------------------------------
      # Get existing task definition
      # ------------------------------------------------------

      - run:

          name: Get ECS Task Definition

          command: |

            echo "=========================================="
            echo "Getting ECS Task Definition"
            echo "=========================================="


            echo "Cluster:"
            echo "<< parameters.cluster-name >>"


            echo "Task Definition:"
            echo "<< parameters.task-definition-family >>"


            aws ecs describe-task-definition \
              --task-definition "<< parameters.task-definition-family >>" \
              --query taskDefinition \
              --output json \
              > /tmp/task-definition.json


            echo "Task definition retrieved successfully."


      # ------------------------------------------------------
      # Prepare new task definition
      # ------------------------------------------------------

      - run:

          name: Prepare ECS Task Definition

          command: |

            echo "=========================================="
            echo "Preparing ECS Task Definition"
            echo "=========================================="


            IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/<< parameters.ecr-repository >>:<< parameters.image-tag >>"


            echo "Image:"
            echo "${IMAGE_URI}"


            echo "DBT Run Mode:"
            echo "<< parameters.dbt-run-mode >>"


            jq \
              --arg IMAGE "${IMAGE_URI}" \
              --arg DBT_RUN_MODE "<< parameters.dbt-run-mode >>" \
              '
              .containerDefinitions[0].image = $IMAGE
              |
              .containerDefinitions[0].environment =
                (
                  .containerDefinitions[0].environment
                  | map(
                      if .name == "DBT_RUN_MODE"
                      then .value = $DBT_RUN_MODE
                      else .
                      end
                    )
                )
              |
              del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy
              )
              ' \
              /tmp/task-definition.json \
              > /tmp/new-task-definition.json


            echo "Prepared task definition."


      # ------------------------------------------------------
      # Register new task definition revision
      # ------------------------------------------------------

      - run:

          name: Register ECS Task Definition

          command: |

            echo "=========================================="
            echo "Registering ECS Task Definition"
            echo "=========================================="


            NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
              --cli-input-json file:///tmp/new-task-definition.json \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text)


            echo "Registered Task Definition:"
            echo "${NEW_TASK_DEF_ARN}"


            echo "${NEW_TASK_DEF_ARN}" > /tmp/new-task-definition-arn


      # ------------------------------------------------------
      # Run ECS Fargate Task
      # ------------------------------------------------------

      - run:

          name: Run ECS Fargate Task

          command: |

            echo "=========================================="
            echo "Running ECS Fargate Task"
            echo "=========================================="


            TASK_DEF_ARN=$(cat /tmp/new-task-definition-arn)


            echo "Cluster:"
            echo "<< parameters.cluster-name >>"


            echo "Task Definition:"
            echo "${TASK_DEF_ARN}"


            echo "Subnet IDs:"
            echo "<< parameters.subnet-ids >>"


            echo "Security Group:"
            echo "<< parameters.security-group-id >>"


            TASK_ARN=$(aws ecs run-task \
              --cluster "<< parameters.cluster-name >>" \
              --task-definition "${TASK_DEF_ARN}" \
              --launch-type FARGATE \
              --network-configuration \
                "awsvpcConfiguration={
                  subnets=[<< parameters.subnet-ids >>],
                  securityGroups=[<< parameters.security-group-id >>],
                  assignPublicIp=ENABLED
                }" \
              --query 'tasks[0].taskArn' \
              --output text)


            echo "Started ECS Task:"
            echo "${TASK_ARN}"


            echo "${TASK_ARN}" > /tmp/ecs-task-arn


      # ------------------------------------------------------
      # Wait for ECS Task
      # ------------------------------------------------------

      - run:

          name: Wait for ECS Task

          command: |

            echo "=========================================="
            echo "Waiting for ECS Task"
            echo "=========================================="


            TASK_ARN=$(cat /tmp/ecs-task-arn)


            aws ecs wait tasks-stopped \
              --cluster "<< parameters.cluster-name >>" \
              --tasks "${TASK_ARN}"


            echo "ECS task stopped."


      # ------------------------------------------------------
      # Check ECS Exit Code
      # ------------------------------------------------------

      - run:

          name: Check ECS Task Result

          command: |

            echo "=========================================="
            echo "Checking ECS Task Result"
            echo "=========================================="


            TASK_ARN=$(cat /tmp/ecs-task-arn)


            EXIT_CODE=$(aws ecs describe-tasks \
              --cluster "<< parameters.cluster-name >>" \
              --tasks "${TASK_ARN}" \
              --query 'tasks[0].containers[0].exitCode' \
              --output text)


            STOPPED_REASON=$(aws ecs describe-tasks \
              --cluster "<< parameters.cluster-name >>" \
              --tasks "${TASK_ARN}" \
              --query 'tasks[0].stoppedReason' \
              --output text)


            echo "Exit Code:"
            echo "${EXIT_CODE}"


            echo "Stopped Reason:"
            echo "${STOPPED_REASON}"


            if [ "${EXIT_CODE}" != "0" ]; then

              echo "=========================================="
              echo "ECS TASK FAILED"
              echo "=========================================="

              exit 1

            fi


            echo "=========================================="
            echo "ECS TASK COMPLETED SUCCESSFULLY"
            echo "=========================================="


# ============================================================
# JOBS
# ============================================================

jobs:


  # ==========================================================
  # QA
  # ==========================================================

  build-push-qa:

    machine:

      image: ubuntu-2204:current


    steps:


      - checkout


      # ------------------------------------------------------
      # Install dependencies
      # ------------------------------------------------------

      - install-dependencies


      # ------------------------------------------------------
      # Configure AWS
      # ------------------------------------------------------

      - configure-aws-oidc


      # ------------------------------------------------------
      # Login to ECR
      # ------------------------------------------------------

      - login-to-ecr


      # ------------------------------------------------------
      # Build QA Docker image
      # ------------------------------------------------------

      - run:

          name: Build QA Docker Image

          command: |

            echo "=========================================="
            echo "Building QA Docker Image"
            echo "=========================================="


            IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${QA_ECR_REPOSITORY}:${CIRCLE_SHA1}-${CIRCLE_BUILD_NUM}"


            echo "Image:"
            echo "${IMAGE_URI}"


            docker build \
              -t "${IMAGE_URI}" \
              .


            echo "QA Docker image built successfully."


      # ------------------------------------------------------
      # Push QA image
      # ------------------------------------------------------

      - run:

          name: Push QA Docker Image

          command: |

            echo "=========================================="
            echo "Pushing QA Docker Image"
            echo "=========================================="


            IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${QA_ECR_REPOSITORY}:${CIRCLE_SHA1}-${CIRCLE_BUILD_NUM}"


            docker push "${IMAGE_URI}"


            echo "QA Docker image pushed successfully."


      # ------------------------------------------------------
      # Run QA ECS
      # ------------------------------------------------------

      - run-ecs-task:

          cluster-name: ecs-qa

          task-definition-family: qa-task-defintion

          ecr-repository: ${QA_ECR_REPOSITORY}

          image-tag: ${CIRCLE_SHA1}-${CIRCLE_BUILD_NUM}

          dbt-run-mode: STATE_AWARE

          subnet-ids: ${SUBNET_IDS}

          security-group-id: ${SECURITY_GROUP_ID}


  # ==========================================================
  # UAT
  # ==========================================================

  build-push-uat:

    machine:

      image: ubuntu-2204:current


    steps:

      - checkout

      - install-dependencies

      - configure-aws-oidc

      - login-to-ecr


      # ------------------------------------------------------
      # Build UAT Docker Image
      # ------------------------------------------------------

      - run:

          name: Build UAT Docker Image

          command: |

            echo "=========================================="
            echo "Building UAT Docker Image"
            echo "=========================================="


            IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${UAT_ECR_REPOSITORY}:${CIRCLE_TAG}-${CIRCLE_BUILD_NUM}"


            docker build \
              -t "${IMAGE_URI}" \
              .


            echo "UAT Docker image built successfully."


      # ------------------------------------------------------
      # Push UAT Docker Image
      # ------------------------------------------------------

      - run:

          name: Push UAT Docker Image

          command: |

            echo "=========================================="
            echo "Pushing UAT Docker Image"
            echo "=========================================="


            IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${UAT_ECR_REPOSITORY}:${CIRCLE_TAG}-${CIRCLE_BUILD_NUM}"


            docker push "${IMAGE_URI}"


      # ------------------------------------------------------
      # Run UAT ECS
      # ------------------------------------------------------

      - run-ecs-task:

          cluster-name: ecs-uat

          task-definition-family: uat-task-definition

          ecr-repository: ${UAT_ECR_REPOSITORY}

          image-tag: ${CIRCLE_TAG}-${CIRCLE_BUILD_NUM}

          dbt-run-mode: STATE_AWARE

          subnet-ids: ${SUBNET_IDS}

          security-group-id: ${SECURITY_GROUP_ID}


  # ==========================================================
  # PROD
  # ==========================================================

  build-push-prod:

    machine:

      image: ubuntu-2204:current


    steps:

      - checkout

      - install-dependencies

      - configure-aws-oidc

      - login-to-ecr


      # ------------------------------------------------------
      # Build PROD Docker Image
      # ------------------------------------------------------

      - run:

          name: Build PROD Docker Image

          command: |

            echo "=========================================="
            echo "Building PROD Docker Image"
            echo "=========================================="


            IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${PROD_ECR_REPOSITORY}:${CIRCLE_TAG}-${CIRCLE_BUILD_NUM}"


            docker build \
              -t "${IMAGE_URI}" \
              .


            echo "PROD Docker image built successfully."


      # ------------------------------------------------------
      # Push PROD Docker Image
      # ------------------------------------------------------

      - run:

          name: Push PROD Docker Image

          command: |

            echo "=========================================="
            echo "Pushing PROD Docker Image"
            echo "=========================================="


            IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${PROD_ECR_REPOSITORY}:${CIRCLE_TAG}-${CIRCLE_BUILD_NUM}"


            docker push "${IMAGE_URI}"


      # ------------------------------------------------------
      # Run PROD ECS
      # ------------------------------------------------------

      - run-ecs-task:

          cluster-name: ecs-prod

          task-definition-family: prod-task-definition

          ecr-repository: ${PROD_ECR_REPOSITORY}

          image-tag: ${CIRCLE_TAG}-${CIRCLE_BUILD_NUM}

          dbt-run-mode: STATE_AWARE

          subnet-ids: ${SUBNET_IDS}

          security-group-id: ${SECURITY_GROUP_ID}


  # ==========================================================
  # DAILY PROD
  # ==========================================================

  run-prod-daily:

    machine:

      image: ubuntu-2204:current


    steps:

      - checkout

      - install-dependencies

      - configure-aws-oidc


      # ------------------------------------------------------
      # Run existing PROD task definition
      # ------------------------------------------------------

      - run:

          name: Daily PROD dbt Run

          command: |

            echo "=========================================="
            echo "Daily PROD dbt Run"
            echo "=========================================="


            echo "Cluster:"
            echo "ecs-prod"


            echo "Task Definition:"
            echo "prod-task-definition"


            echo "DBT_RUN_MODE:"
            echo "FULL"


            # ------------------------------------------------
            # Get latest PROD task definition
            # ------------------------------------------------

            TASK_DEF_ARN=$(aws ecs describe-task-definition \
              --task-definition prod-task-definition \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text)


            echo "Using task definition:"
            echo "${TASK_DEF_ARN}"


            # ------------------------------------------------
            # Run PROD ECS task
            # ------------------------------------------------

            TASK_ARN=$(aws ecs run-task \
              --cluster ecs-prod \
              --task-definition "${TASK_DEF_ARN}" \
              --launch-type FARGATE \
              --network-configuration \
                "awsvpcConfiguration={
                  subnets=[${SUBNET_IDS}],
                  securityGroups=[${SECURITY_GROUP_ID}],
                  assignPublicIp=ENABLED
                }" \
              --overrides \
                '{
                  "containerOverrides": [
                    {
                      "name": "dbt",
                      "environment": [
                        {
                          "name": "DBT_RUN_MODE",
                          "value": "FULL"
                        }
                      ]
                    }
                  ]
                }' \
              --query 'tasks[0].taskArn' \
              --output text)


            echo "Started task:"
            echo "${TASK_ARN}"


            # ------------------------------------------------
            # Wait
            # ------------------------------------------------

            aws ecs wait tasks-stopped \
              --cluster ecs-prod \
              --tasks "${TASK_ARN}"


            echo "PROD task stopped."


            # ------------------------------------------------
            # Check exit code
            # ------------------------------------------------

            EXIT_CODE=$(aws ecs describe-tasks \
              --cluster ecs-prod \
              --tasks "${TASK_ARN}" \
              --query 'tasks[0].containers[0].exitCode' \
              --output text)


            STOPPED_REASON=$(aws ecs describe-tasks \
              --cluster ecs-prod \
              --tasks "${TASK_ARN}" \
              --query 'tasks[0].stoppedReason' \
              --output text)


            echo "Exit Code:"
            echo "${EXIT_CODE}"


            echo "Stopped Reason:"
            echo "${STOPPED_REASON}"


            if [ "${EXIT_CODE}" != "0" ]; then

              echo "Daily PROD dbt task failed."

              exit 1

            fi


            echo "Daily PROD dbt task completed successfully."


# ============================================================
# WORKFLOWS
# ============================================================

workflows:


  # ==========================================================
  # MAIN DEPLOYMENT WORKFLOW
  # ==========================================================

  deployment:

    jobs:


      # ------------------------------------------------------
      # QA
      # ------------------------------------------------------

      - build-push-qa:

          filters:

            branches:

              only:

                - main


      # ------------------------------------------------------
      # UAT
      # ------------------------------------------------------

      - hold-uat:

          type: approval

          requires:

            - build-push-qa

          filters:

            tags:

              only: /^v.*/

            branches:

              ignore: /.*/


      - build-push-uat:

          requires:

            - hold-uat

          filters:

            tags:

              only: /^v.*/

            branches:

              ignore: /.*/


      # ------------------------------------------------------
      # PROD
      # ------------------------------------------------------

      - hold-prod:

          type: approval

          requires:

            - build-push-uat

          filters:

            tags:

              only: /^v.*/

            branches:

              ignore: /.*/


      - build-push-prod:

          requires:

            - hold-prod

          filters:

            tags:

              only: /^v.*/

            branches:

              ignore: /.*/


  # ==========================================================
  # DAILY PROD WORKFLOW
  # ==========================================================

  daily-prod:

    triggers:

      - schedule:

          cron: "0 6 * * *"

          filters:

            branches:

              only:

                - main


    jobs:

      - run-prod-daily:

          filters:

            branches:

              only:

                - main