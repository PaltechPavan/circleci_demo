version: 2.1

orbs:
  python: circleci/python@3.1.0
  aws-cli: circleci/aws-cli@5.2.0

# ============================================================
# REUSABLE COMMANDS
# ============================================================

commands:

  install-dependencies:
    description: Install Python and dbt dependencies with Poetry
    steps:
      - checkout
      - run:
          name: Configure Poetry
          command: |
            poetry config virtualenvs.in-project true

      - python/install-packages:
          pkg-manager: poetry
          args: --with dev

  configure-aws-oidc:
    description: Configure AWS credentials using CircleCI OIDC
    steps:
      - aws-cli/setup:
          role_arn: $AWS_ROLE_ARN
          region: $AWS_REGION

      - run:
          name: Verify AWS Identity
          command: |
            aws sts get-caller-identity

  login-to-ecr:
    description: Login to Amazon ECR
    steps:
      - run:
          name: Login to ECR
          command: |
            aws ecr get-login-password --region "$AWS_REGION" | \
            docker login \
              --username AWS \
              --password-stdin \
              "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

  run-ecs-task:
    description: >
      Register a new ECS task-definition revision using the newly built image,
      run it as a one-off Fargate task, wait for completion, and fail if dbt fails.

    parameters:
      cluster:
        type: string

      task-definition-family:
        type: string

      ecr-repository-env-var:
        type: string

      image-tag:
        type: string

      subnet-ids:
        type: string

      security-group-id:
        type: string

      public-ip-status:
        type: string
        default: DISABLED

    steps:
      - run:
          name: Run dbt on ECS Fargate (<< parameters.task-definition-family >>)
          command: |

            IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${<< parameters.ecr-repository-env-var >>}:<< parameters.image-tag >>"

            NEW_TASK_DEF_JSON=$(aws ecs describe-task-definition \
              --task-definition "<< parameters.task-definition-family >>" \
              --query 'taskDefinition' | \
              jq --arg IMAGE "$IMAGE_URI" '
                .containerDefinitions[0].image=$IMAGE |
                del(
                  .taskDefinitionArn,
                  .revision,
                  .status,
                  .requiresAttributes,
                  .compatibilities,
                  .registeredAt,
                  .registeredBy
                )'
            )

            NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
              --cli-input-json "$NEW_TASK_DEF_JSON" \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text)

            echo "Registered Task Definition:"
            echo "$NEW_TASK_DEF_ARN"

            TASK_ARN=$(aws ecs run-task \
              --cluster "<< parameters.cluster >>" \
              --task-definition "$NEW_TASK_DEF_ARN" \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[<< parameters.subnet-ids >>],securityGroups=[<< parameters.security-group-id >>],assignPublicIp=<< parameters.public-ip-status >>}" \
              --query 'tasks[0].taskArn' \
              --output text)

            if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
              echo "ERROR: ECS task failed to start."
              exit 1
            fi

            echo "Started task:"
            echo "$TASK_ARN"

            aws ecs wait tasks-stopped \
              --cluster "<< parameters.cluster >>" \
              --tasks "$TASK_ARN"

            EXIT_CODE=$(aws ecs describe-tasks \
              --cluster "<< parameters.cluster >>" \
              --tasks "$TASK_ARN" \
              --query 'tasks[0].containers[0].exitCode' \
              --output text)

            echo "dbt Exit Code: $EXIT_CODE"

            if [ "$EXIT_CODE" != "0" ]; then
              echo "dbt execution failed."
              exit 1
            fi

# ============================================================
# JOBS
# ============================================================

jobs:

  # ==========================================================
  # QA
  # main -> Build -> QA ECR -> QA ECS
  # ==========================================================

  build-push-qa:
    machine:
      image: ubuntu-2204:current

    steps:
      - checkout

      - configure-aws-oidc

      - login-to-ecr

      - run:
          name: Install jq
          command: |
            sudo apt-get update
            sudo apt-get install -y jq

      - run:
          name: Build and Push QA Image
          command: |

            IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${QA_ECR_REPOSITORY}"
            IMAGE_TAG="${CIRCLE_SHA1}-${CIRCLE_BUILD_NUM}"

            docker build \
              --tag "${IMAGE_URI}:${IMAGE_TAG}" \
              .

            docker push "${IMAGE_URI}:${IMAGE_TAG}"

            echo "QA Image:"
            echo "${IMAGE_URI}:${IMAGE_TAG}"

      - run-ecs-task:
          cluster: ecs-qa
          task-definition-family: qa-task-defintion
          ecr-repository-env-var: QA_ECR_REPOSITORY
          image-tag: ${CIRCLE_SHA1}-${CIRCLE_BUILD_NUM}
          subnet-ids: $SUBNET_IDS
          security-group-id: $SECURITY_GROUP_ID
          public-ip-status: $PUBLIC_IP_STATUS

  # ==========================================================
  # UAT
  # Release Tag -> Approval -> Build -> UAT ECR -> UAT ECS
  # ==========================================================

  build-push-uat:
    machine:
      image: ubuntu-2204:current

    steps:
      - checkout

      - configure-aws-oidc

      - login-to-ecr

      - run:
          name: Install jq
          command: |
            sudo apt-get update
            sudo apt-get install -y jq

      - run:
          name: Build and Push UAT Image
          command: |

            IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${UAT_ECR_REPOSITORY}"
            IMAGE_TAG="${CIRCLE_TAG}-${CIRCLE_BUILD_NUM}"

            docker build \
              --tag "${IMAGE_URI}:${IMAGE_TAG}" \
              .

            docker push "${IMAGE_URI}:${IMAGE_TAG}"

            echo "UAT Image:"
            echo "${IMAGE_URI}:${IMAGE_TAG}"

      - run-ecs-task:
          cluster: ecs-uat
          task-definition-family: umed-app-task-uat
          ecr-repository-env-var: UAT_ECR_REPOSITORY
          image-tag: ${CIRCLE_TAG}-${CIRCLE_BUILD_NUM}
          subnet-ids: $SUBNET_IDS
          security-group-id: $SECURITY_GROUP_ID
          public-ip-status: $PUBLIC_IP_STATUS

  # ==========================================================
  # PROD
  # Release Tag -> Approval -> Build -> PROD ECR -> PROD ECS
  # ==========================================================

  build-push-prod:
    machine:
      image: ubuntu-2204:current

    steps:
      - checkout

      - configure-aws-oidc

      - login-to-ecr

      - run:
          name: Install jq
          command: |
            sudo apt-get update
            sudo apt-get install -y jq

      - run:
          name: Build and Push PROD Image
          command: |

            IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${PROD_ECR_REPOSITORY}"
            IMAGE_TAG="${CIRCLE_TAG}-${CIRCLE_BUILD_NUM}"

            docker build \
              --tag "${IMAGE_URI}:${IMAGE_TAG}" \
              .

            docker push "${IMAGE_URI}:${IMAGE_TAG}"

            echo "PROD Image:"
            echo "${IMAGE_URI}:${IMAGE_TAG}"

      - run-ecs-task:
          cluster: ecs-prod
          task-definition-family: umed-app-task
          ecr-repository-env-var: PROD_ECR_REPOSITORY
          image-tag: ${CIRCLE_TAG}-${CIRCLE_BUILD_NUM}
          subnet-ids: $SUBNET_IDS
          security-group-id: $SECURITY_GROUP_ID
          public-ip-status: $PUBLIC_IP_STATUS

# ============================================================
# WORKFLOWS
# ============================================================

workflows:

  # ==========================================================
  # Merge to main -> QA Deployment
  # ==========================================================

  qa:
    jobs:
      - build-push-qa:
          context: us-dbt
          filters:
            branches:
              only:
                - main
            tags:
              ignore: /.*/

  # ==========================================================
  # Release Candidate
  # Tag Example:
  #   v1.0.0-rc-0
  # ==========================================================

  release-candidate:
    jobs:

      - approve-uat:
          type: approval
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+-rc-\d+$/

      - build-push-uat:
          context: us-dbt
          requires:
            - approve-uat
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+-rc-\d+$/

      - approve-prod:
          type: approval
          requires:
            - build-push-uat
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+-rc-\d+$/

      - build-push-prod:
          context: us-dbt
          requires:
            - approve-prod
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+-rc-\d+$/