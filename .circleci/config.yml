version: 2.1

orbs:
  aws-cli: circleci/aws-cli@5.4.1

jobs:

  # =========================================================
  # FEATURE / PULL REQUEST VALIDATION
  # =========================================================

  validate-models:
    docker:
      - image: cimg/python:3.11

    environment:
      DBT_PROFILES_DIR: .

    steps:

      - checkout

      - run:
          name: Verify Checkout and Commit
          command: |
            echo "========================================"
            echo "Current Branch"
            echo "========================================"
            git branch --show-current

            echo ""
            echo "========================================"
            echo "Current Commit"
            echo "========================================"
            git log -1 --oneline

            echo ""
            echo "========================================"
            echo "Git Status"
            echo "========================================"
            git status

      - run:
          name: Show Project Files
          command: |
            echo "========================================"
            echo "Project Files"
            echo "========================================"
            find . -maxdepth 3 -type f | sort

      - run:
          name: Install Dependencies
          command: |
            echo "========================================"
            echo "Installing Dependencies"
            echo "========================================"
            python --version
            pip --version

            pip install --upgrade pip
            pip install -r requirements.txt

      - run:
          name: Verify dbt Installation
          command: |
            dbt --version

      - run:
          name: dbt Dependencies
          command: |
            dbt deps

      - run:
          name: Show dbt Configuration
          command: |
            echo "========================================"
            echo "dbt Project"
            echo "========================================"
            cat dbt_project.yml

            echo ""
            echo "========================================"
            echo "dbt Profile"
            echo "========================================"
            cat profiles.yml

      - run:
          name: dbt Parse
          command: |
            echo "========================================"
            echo "Running dbt parse"
            echo "========================================"

            dbt parse --no-partial-parse

      - run:
          name: Check dbt Models
          command: |
            echo "========================================"
            echo "Available dbt Models"
            echo "========================================"

            dbt ls \
              --resource-type model \
              --output name

      - run:
          name: SQL Linting
          command: |
            echo "========================================"
            echo "Running SQLFluff"
            echo "========================================"

            sqlfluff lint models/

      - aws-cli/setup:
          role_arn: "arn:aws:iam::008300323897:role/circle-ci-oidc-role"
          region: "ap-south-1"

      - run:
          name: Verify AWS Identity
          command: |
            echo "========================================"
            echo "AWS Identity"
            echo "========================================"

            aws sts get-caller-identity

      # -------------------------------------------------------
      # Download the baseline manifest generated by MAIN.
      # -------------------------------------------------------

      - run:
          name: Download Main dbt State
          command: |
            echo "========================================"
            echo "Downloading Main dbt Manifest"
            echo "========================================"

            rm -rf .state
            mkdir -p .state/main

            aws s3 cp \
              s3://dummu-circleci-s3-bucket/dbt-state/main/manifest.json \
              .state/main/manifest.json

            if [ ! -s .state/main/manifest.json ]; then
              echo "ERROR: downloaded main manifest is missing or empty."
              exit 1
            fi

            echo ""
            echo "========================================"
            echo "Main Manifest"
            echo "========================================"

            ls -lh .state/main/manifest.json

      # -------------------------------------------------------
      # Validate BOTH manifests before state comparison.
      # -------------------------------------------------------

      - run:
          name: Validate dbt Manifests
          command: |
            echo "========================================"
            echo "Validating Feature Manifest"
            echo "========================================"

            test -s target/manifest.json

            python - <<'PY'
            import json

            with open("target/manifest.json", "r", encoding="utf-8") as f:
                manifest = json.load(f)

            models = [
                node_id
                for node_id, node in manifest.get("nodes", {}).items()
                if node_id.startswith("model.")
            ]

            print("Feature manifest: VALID")
            print("Feature model count:", len(models))

            for model in models:
                print("  ", model)
            PY

            echo ""
            echo "========================================"
            echo "Validating Main Manifest"
            echo "========================================"

            test -s .state/main/manifest.json

            python - <<'PY'
            import json

            with open(".state/main/manifest.json", "r", encoding="utf-8") as f:
                manifest = json.load(f)

            models = [
                node_id
                for node_id, node in manifest.get("nodes", {}).items()
                if node_id.startswith("model.")
            ]

            print("Main manifest: VALID")
            print("Main model count:", len(models))

            for model in models:
                print("  ", model)
            PY

      # -------------------------------------------------------
      # Slim CI: changed models only.
      # -------------------------------------------------------

      - run:
          name: Find Changed Models
          command: |
            echo "========================================"
            echo "Slim CI - Changed Models"
            echo "========================================"

            dbt ls \
              --select state:modified \
              --state .state/main \
              --resource-type model \
              --output name

      # -------------------------------------------------------
      # Slim CI: changed models + downstream dependencies.
      # -------------------------------------------------------

      - run:
          name: Find Changed and Affected Models
          command: |
            echo "========================================"
            echo "Slim CI - Changed + Downstream Models"
            echo "========================================"

            dbt ls \
              --select state:modified+ \
              --state .state/main \
              --resource-type model \
              --output name

      # -------------------------------------------------------
      # ACTUAL Slim CI execution.
      # CI target = dev_ci -> awsdatacatalog.practice
      # -------------------------------------------------------

      - run:
          name: Slim CI dbt Build
          command: |
            echo "========================================"
            echo "Slim CI dbt Build"
            echo "========================================"

            echo "Target: dev_ci"
            echo "Catalog: awsdatacatalog"
            echo "Database: practice"

            echo ""
            echo "Running changed + downstream models..."

            dbt build \
              --target dev_ci \
              --select state:modified+ \
              --state .state/main \
              --no-partial-parse

            echo ""
            echo "========================================"
            echo "Slim CI Completed Successfully"
            echo "========================================"


  # =========================================================
  # MAIN BRANCH - GENERATE AND STORE DBT STATE
  # =========================================================

  generate-dbt-state:
    docker:
      - image: cimg/python:3.11

    environment:
      DBT_PROFILES_DIR: .

    steps:

      - checkout

      - run:
          name: Verify Main Branch
          command: |
            echo "========================================"
            echo "Current Branch"
            echo "========================================"
            git branch --show-current

            echo ""
            echo "========================================"
            echo "Current Commit"
            echo "========================================"
            git log -1 --oneline

      - run:
          name: Install dbt Dependencies
          command: |
            python --version

            pip install --upgrade pip
            pip install -r requirements.txt

      - run:
          name: Verify dbt
          command: |
            dbt --version

      - run:
          name: dbt Dependencies
          command: |
            dbt deps

      # -------------------------------------------------------
      # Generate target/manifest.json from the exact MAIN code.
      # -------------------------------------------------------

      - run:
          name: Generate Main dbt Manifest
          command: |
            echo "========================================"
            echo "Generating Main dbt Manifest"
            echo "========================================"

            dbt parse --no-partial-parse

      # -------------------------------------------------------
      # Do not upload an empty/invalid manifest.
      # -------------------------------------------------------

      - run:
          name: Validate Main Manifest
          command: |
            echo "========================================"
            echo "Checking Main Manifest"
            echo "========================================"

            if [ ! -f target/manifest.json ]; then
              echo "ERROR: target/manifest.json does not exist."
              exit 1
            fi

            if [ ! -s target/manifest.json ]; then
              echo "ERROR: target/manifest.json is empty."
              exit 1
            fi

            ls -lh target/manifest.json

            python - <<'PY'
            import json

            with open("target/manifest.json", "r", encoding="utf-8") as f:
                manifest = json.load(f)

            models = [
                node_id
                for node_id, node in manifest.get("nodes", {}).items()
                if node_id.startswith("model.")
            ]

            print("Main manifest: VALID JSON")
            print("Main model count:", len(models))

            for model in models:
                print("  ", model)
            PY

      - aws-cli/setup:
          role_arn: "arn:aws:iam::008300323897:role/circle-ci-oidc-role"
          region: "ap-south-1"

      - run:
          name: Verify AWS Identity
          command: |
            aws sts get-caller-identity

      # -------------------------------------------------------
      # Upload the valid MAIN baseline.
      # -------------------------------------------------------

      - run:
          name: Upload Main Manifest to S3
          command: |
            echo "========================================"
            echo "Uploading Main Manifest"
            echo "========================================"

            aws s3 cp \
              target/manifest.json \
              s3://dummu-circleci-s3-bucket/dbt-state/main/manifest.json

      # -------------------------------------------------------
      # Download it back and validate the actual S3 object.
      # This prevents another empty/invalid state file.
      # -------------------------------------------------------

      - run:
          name: Verify Main Manifest in S3
          command: |
            echo "========================================"
            echo "Verifying S3 Manifest"
            echo "========================================"

            aws s3api head-object \
              --bucket dummu-circleci-s3-bucket \
              --key dbt-state/main/manifest.json

            rm -f /tmp/main-manifest.json

            aws s3 cp \
              s3://dummu-circleci-s3-bucket/dbt-state/main/manifest.json \
              /tmp/main-manifest.json

            if [ ! -s /tmp/main-manifest.json ]; then
              echo "ERROR: S3 manifest is empty."
              exit 1
            fi

            python - <<'PY'
            import json

            with open("/tmp/main-manifest.json", "r", encoding="utf-8") as f:
                manifest = json.load(f)

            models = [
                node_id
                for node_id, node in manifest.get("nodes", {}).items()
                if node_id.startswith("model.")
            ]

            print("S3 manifest: VALID JSON")
            print("S3 model count:", len(models))

            for model in models:
                print("  ", model)
            PY

            echo ""
            echo "========================================"
            echo "Main Manifest Successfully Stored"
            echo "========================================"

            aws s3 ls \
              s3://dummu-circleci-s3-bucket/dbt-state/main/


  # =========================================================
  # MAIN BRANCH DEPLOYMENT
  # CURRENT: main -> S3 models
  # FUTURE:  main -> Docker -> ECR -> ECS/Fargate
  # =========================================================

  model-deploy:
    docker:
      - image: cimg/aws:2025.01

    steps:

      - checkout

      - aws-cli/setup:
          role_arn: "arn:aws:iam::008300323897:role/circle-ci-oidc-role"
          region: "ap-south-1"

      - run:
          name: Verify AWS Identity
          command: |
            echo "========================================"
            echo "AWS Identity"
            echo "========================================"

            aws sts get-caller-identity

      - run:
          name: Show Models
          command: |
            echo "========================================"
            echo "Models in GitHub"
            echo "========================================"

            find models -type f -print

      - run:
          name: Sync Models to S3
          command: |
            echo "========================================"
            echo "Synchronizing Models with S3"
            echo "========================================"

            aws s3 sync \
              models/ \
              s3://dummu-circleci-s3-bucket/models/ \
              --delete

      - run:
          name: Verify S3 Models
          command: |
            echo "========================================"
            echo "Models Currently in S3"
            echo "========================================"

            aws s3 ls \
              s3://dummu-circleci-s3-bucket/models/


# ===========================================================
# WORKFLOWS
# ===========================================================

workflows:

  # =========================================================
  # FEATURE / PR VALIDATION
  # =========================================================

  feature-validation:
    jobs:

      - validate-models:
          filters:
            branches:
              ignore:
                - main


  # =========================================================
  # MAIN DEPLOYMENT
  # =========================================================

  deploy:
    jobs:

      # Generate and store the MAIN dbt baseline first.
      - generate-dbt-state:
          filters:
            branches:
              only:
                - main

      # Deploy models only after the baseline succeeds.
      - model-deploy:
          requires:
            - generate-dbt-state
          filters:
            branches:
              only:
                - main