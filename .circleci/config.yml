version: 2.1

orbs:
  aws-cli: circleci/aws-cli@5.4.1

jobs:
  aws-oidc-test:
    docker:
      - image: cimg/aws:2025.01

    steps:
      - checkout

      - aws-cli/setup:
          role_arn: "arn:aws:iam::008300323897:role/circle-ci-oidc-role"
          region: "ap-south-1"

      - run:
          name: Verify AWS Identity
          command: |
            echo "Checking AWS identity..."
            aws sts get-caller-identity

      - run:
          name: Detect and deploy changed models
          command: |
            echo "======================================"
            echo "Detecting changed models..."
            echo "======================================"

            CHANGES=$(git diff --name-status HEAD^ HEAD -- models/)

            echo "$CHANGES"

            if [ -z "$CHANGES" ]; then
              echo "No model changes detected."
              exit 0
            fi

            echo ""
            echo "======================================"
            echo "Processing changed models..."
            echo "======================================"

            echo "$CHANGES" | while read -r status file
            do
              echo ""
              echo "Status: $status"
              echo "File: $file"

              case "$status" in

                A|M)
                  echo "Uploading: $file"

                  aws s3 cp "$file" \
                    "s3://dummu-circleci-s3-bucket/$file"

                  echo "Successfully uploaded: $file"
                  ;;

                D)
                  echo "Deleting: $file"

                  aws s3 rm \
                    "s3://dummu-circleci-s3-bucket/$file"

                  echo "Successfully deleted: $file"
                  ;;

                *)
                  echo "Skipping status: $status"
                  ;;

              esac
            done

            echo ""
            echo "======================================"
            echo "Models currently in S3:"
            echo "======================================"

            aws s3 ls s3://dummu-circleci-s3-bucket/models/

workflows:
  oidc-test:
    jobs:
      - aws-oidc-test:
          filters:
            branches:
              only:
                - main