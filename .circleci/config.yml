version: 2.1

orbs:
  python: circleci/python@3.1.0
  aws-cli: circleci/aws-cli@5.2.0

# ============================================================
# REUSABLE COMMANDS
# ============================================================

commands:

  configure-aws-oidc:
    description: Configure AWS credentials using CircleCI OIDC
    steps:
      - aws-cli/setup:
          role_arn: $AWS_ROLE_ARN
          region: $AWS_REGION

      - run:
          name: Verify AWS Identity
          command: aws sts get-caller-identity

  login-to-ecr:
    description: Login to Amazon ECR
    steps:
      - run:
          name: Login to Amazon ECR
          command: |
            aws ecr get-login-password --region "$AWS_REGION" | \
            docker login \
              --username AWS \
              --password-stdin \
              "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

  run-ecs-task:
    description: Register a new task definition revision and run it on ECS.

    parameters:
      cluster:
        type: string
      task-definition-family:
        type: string
      ecr-repository-env-var:
        type: string
      image-tag:
        type: string
      subnet-ids:
        type: string
      security-group-id:
        type: string
      public-ip-status:
        type: string
        default: DISABLED

    steps:
      - run:
          name: Validate ECS Resources
          command: |
            echo "========================================"
            echo "Validating AWS Environment"
            echo "========================================"

            echo "Region: $AWS_REGION"
            echo "Cluster: << parameters.cluster >>"
            echo "Task Definition: << parameters.task-definition-family >>"

            echo "----------------------------------------"
            echo "Caller Identity"
            echo "----------------------------------------"
            aws sts get-caller-identity

            echo "----------------------------------------"
            echo "Available ECS Clusters"
            echo "----------------------------------------"
            aws ecs list-clusters --region "$AWS_REGION"

            echo "----------------------------------------"
            echo "Available Task Definitions"
            echo "----------------------------------------"
            aws ecs list-task-definitions --region "$AWS_REGION"

            echo "----------------------------------------"
            echo "Validating Task Definition"
            echo "----------------------------------------"

            aws ecs describe-task-definition \
              --task-definition "<< parameters.task-definition-family >>" \
              --region "$AWS_REGION"

      - run:
          name: Run dbt on ECS Fargate
          command: |

            IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${<< parameters.ecr-repository-env-var >>}:<< parameters.image-tag >>"

            NEW_TASK_DEF_JSON=$(aws ecs describe-task-definition \
              --task-definition "<< parameters.task-definition-family >>" \
              --region "$AWS_REGION" \
              --query taskDefinition | \
              jq --arg IMAGE "$IMAGE_URI" '
                .containerDefinitions[0].image=$IMAGE |
                del(
                  .taskDefinitionArn,
                  .revision,
                  .status,
                  .requiresAttributes,
                  .compatibilities,
                  .registeredAt,
                  .registeredBy
                )')

            NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
              --cli-input-json "$NEW_TASK_DEF_JSON" \
              --query taskDefinition.taskDefinitionArn \
              --output text)

            echo "Registered Task Definition:"
            echo "$NEW_TASK_DEF_ARN"

            TASK_ARN=$(aws ecs run-task \
              --cluster "<< parameters.cluster >>" \
              --task-definition "$NEW_TASK_DEF_ARN" \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[<< parameters.subnet-ids >>],securityGroups=[<< parameters.security-group-id >>],assignPublicIp=<< parameters.public-ip-status >>}" \
              --query tasks[0].taskArn \
              --output text)

            if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
              echo "ERROR: ECS task failed to start."
              exit 1
            fi

            echo "Started Task:"
            echo "$TASK_ARN"

            aws ecs wait tasks-stopped \
              --cluster "<< parameters.cluster >>" \
              --tasks "$TASK_ARN"

            echo "========================================"
            echo "Task Status"
            echo "========================================"

            TASK_INFO=$(aws ecs describe-tasks \
              --cluster "<< parameters.cluster >>" \
              --tasks "$TASK_ARN")

            LAST_STATUS=$(echo "$TASK_INFO" | jq -r '.tasks[0].lastStatus')
            EXIT_CODE=$(echo "$TASK_INFO" | jq -r '.tasks[0].containers[0].exitCode')
            STOPPED_REASON=$(echo "$TASK_INFO" | jq -r '.tasks[0].stoppedReason')
            CONTAINER_REASON=$(echo "$TASK_INFO" | jq -r '.tasks[0].containers[0].reason')

            echo "Last Status : $LAST_STATUS"
            echo "Exit Code   : $EXIT_CODE"
            echo "Stopped     : $STOPPED_REASON"
            echo "Container   : $CONTAINER_REASON"

            if [ "$EXIT_CODE" != "0" ]; then
              echo "dbt execution failed."
              exit 1
            fi

# ============================================================
# JOBS
# ============================================================

jobs:

  build-push-qa:
    machine:
      image: ubuntu-2204:current

    steps:
      - checkout
      - configure-aws-oidc
      - login-to-ecr

      - run:
          name: Install jq
          command: |
            sudo apt-get update
            sudo apt-get install -y jq

      - run:
          name: Build & Push QA Image
          command: |
            IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${QA_ECR_REPOSITORY}"
            IMAGE_TAG="${CIRCLE_SHA1}-${CIRCLE_BUILD_NUM}"

            docker build -t "${IMAGE_URI}:${IMAGE_TAG}" .
            docker push "${IMAGE_URI}:${IMAGE_TAG}"

      - run-ecs-task:
          cluster: ecs-qa
          task-definition-family: qa-task-defintion
          ecr-repository-env-var: QA_ECR_REPOSITORY
          image-tag: ${CIRCLE_SHA1}-${CIRCLE_BUILD_NUM}
          subnet-ids: $SUBNET_IDS
          security-group-id: $SECURITY_GROUP_ID
          public-ip-status: $PUBLIC_IP_STATUS

  build-push-uat:
    machine:
      image: ubuntu-2204:current

    steps:
      - checkout
      - configure-aws-oidc
      - login-to-ecr

      - run:
          name: Install jq
          command: |
            sudo apt-get update
            sudo apt-get install -y jq

      - run:
          name: Build & Push UAT Image
          command: |
            IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${UAT_ECR_REPOSITORY}"
            IMAGE_TAG="${CIRCLE_TAG}-${CIRCLE_BUILD_NUM}"

            docker build -t "${IMAGE_URI}:${IMAGE_TAG}" .
            docker push "${IMAGE_URI}:${IMAGE_TAG}"

      - run-ecs-task:
          cluster: ecs-uat
          task-definition-family: uat-task-definition
          ecr-repository-env-var: UAT_ECR_REPOSITORY
          image-tag: ${CIRCLE_TAG}-${CIRCLE_BUILD_NUM}
          subnet-ids: $SUBNET_IDS
          security-group-id: $SECURITY_GROUP_ID
          public-ip-status: $PUBLIC_IP_STATUS

  build-push-prod:
    machine:
      image: ubuntu-2204:current

    steps:
      - checkout
      - configure-aws-oidc
      - login-to-ecr

      - run:
          name: Install jq
          command: |
            sudo apt-get update
            sudo apt-get install -y jq

      - run:
          name: Build & Push PROD Image
          command: |
            IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${PROD_ECR_REPOSITORY}"
            IMAGE_TAG="${CIRCLE_TAG}-${CIRCLE_BUILD_NUM}"

            docker build -t "${IMAGE_URI}:${IMAGE_TAG}" .
            docker push "${IMAGE_URI}:${IMAGE_TAG}"

      - run-ecs-task:
          cluster: ecs-prod
          task-definition-family: prod-task-definition
          ecr-repository-env-var: PROD_ECR_REPOSITORY
          image-tag: ${CIRCLE_TAG}-${CIRCLE_BUILD_NUM}
          subnet-ids: $SUBNET_IDS
          security-group-id: $SECURITY_GROUP_ID
          public-ip-status: $PUBLIC_IP_STATUS

# ============================================================
# WORKFLOWS
# ============================================================

workflows:

  qa:
    jobs:
      - build-push-qa:
          context: us-dbt
          filters:
            branches:
              only: main
            tags:
              ignore: /.*/

  release-candidate:
    jobs:

      - approve-uat:
          type: approval
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+-rc-\d+$/

      - build-push-uat:
          context: us-dbt
          requires:
            - approve-uat
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+-rc-\d+$/

      - approve-prod:
          type: approval
          requires:
            - build-push-uat
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+-rc-\d+$/

      - build-push-prod:
          context: us-dbt
          requires:
            - approve-prod
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+-rc-\d+$/