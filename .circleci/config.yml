version: 2.1

orbs:
  python: circleci/python@3.1.0
  aws-cli: circleci/aws-cli@5.2.0

# ============================================================
# REUSABLE COMMANDS
# ============================================================

commands:

  install-dependencies:
    description: Install Python and dbt dependencies with Poetry
    steps:
      - checkout

      - run:
          name: Configure Poetry
          command: |
            poetry config virtualenvs.in-project true

      - python/install-packages:
          pkg-manager: poetry
          args: --with dev

  configure-aws-oidc:
    description: Configure AWS credentials using CircleCI OIDC
    steps:
      - aws-cli/setup:
          role_arn: $AWS_ROLE_ARN
          region: $AWS_REGION

      - run:
          name: Verify AWS identity
          command: |
            aws sts get-caller-identity

  login-to-ecr:
    description: Login to Amazon ECR
    steps:
      - run:
          name: Login to ECR
          command: |
            aws ecr get-login-password \
              --region "$AWS_REGION" |
              docker login \
                --username AWS \
                --password-stdin \
                "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

  # ==========================================================
  # RUN ECS TASK FOR DEPLOYMENT
  # ==========================================================

  run-ecs-task:
    description: >
      Register a new task-definition revision using the image built
      by the deployment and run it as a one-off ECS Fargate task.

    parameters:
      cluster:
        type: string

      task-definition-family:
        type: string

      ecr-repository-env-var:
        type: string

      image-tag:
        type: string

      subnet-ids:
        type: string

      security-group-id:
        type: string

      public-ip-status:
        type: string
        default: DISABLED

      dbt-run-mode:
        type: string
        default: STATE_AWARE

    steps:

      - run:
          name: Run dbt on ECS Fargate (<<parameters.task-definition-family>>)
          command: |

            IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${<<parameters.ecr-repository-env-var>>}:<<parameters.image-tag>>"

            echo "=========================================="
            echo "ECS Deployment Task"
            echo "=========================================="

            echo "Cluster:"
            echo "<<parameters.cluster>>"

            echo "Task Definition:"
            echo "<<parameters.task-definition-family>>"

            echo "Image:"
            echo "${IMAGE_URI}"

            echo "DBT_RUN_MODE:"
            echo "<<parameters.dbt-run-mode>>"

            # ------------------------------------------------
            # Get existing task definition
            # ------------------------------------------------

            NEW_TASK_DEF_JSON=$(aws ecs describe-task-definition \
              --task-definition "<<parameters.task-definition-family>>" \
              --query 'taskDefinition' | \
              jq --arg IMAGE "$IMAGE_URI" \
                 --arg RUN_MODE "<<parameters.dbt-run-mode>>" \
                '.containerDefinitions[0].image = $IMAGE
                 | .containerDefinitions[0].environment =
                   ((.containerDefinitions[0].environment // [])
                    | map(select(.name != "DBT_RUN_MODE"))
                    + [{"name":"DBT_RUN_MODE","value":$RUN_MODE}])
                 | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                       .compatibilities, .registeredAt, .registeredBy)')

            # ------------------------------------------------
            # Register new task definition revision
            # ------------------------------------------------

            NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
              --cli-input-json "$NEW_TASK_DEF_JSON" \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text)

            echo "Registered task definition:"
            echo "${NEW_TASK_DEF_ARN}"

            # ------------------------------------------------
            # Run ECS task
            # ------------------------------------------------

            TASK_ARN=$(aws ecs run-task \
              --cluster "<<parameters.cluster>>" \
              --task-definition "$NEW_TASK_DEF_ARN" \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[<<parameters.subnet-ids>>],securityGroups=[<<parameters.security-group-id>>],assignPublicIp=<<parameters.public-ip-status>>}" \
              --query 'tasks[0].taskArn' \
              --output text)

            if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
              echo "ERROR: ecs run-task did not return a task ARN"
              exit 1
            fi

            echo "Started ECS task:"
            echo "${TASK_ARN}"

            # ------------------------------------------------
            # Wait for task completion
            # ------------------------------------------------

            aws ecs wait tasks-stopped \
              --cluster "<<parameters.cluster>>" \
              --tasks "$TASK_ARN"

            # ------------------------------------------------
            # Get dbt container exit code
            # ------------------------------------------------

            EXIT_CODE=$(aws ecs describe-tasks \
              --cluster "<<parameters.cluster>>" \
              --tasks "$TASK_ARN" \
              --query 'tasks[0].containers[0].exitCode' \
              --output text)

            echo "dbt task exit code: ${EXIT_CODE}"

            if [ "$EXIT_CODE" != "0" ]; then
              echo "dbt run failed."
              echo "Check CloudWatch Logs for this ECS task."
              exit 1
            fi

            echo "ECS dbt task completed successfully."


# ============================================================
# JOBS
# ============================================================

jobs:

  # ==========================================================
  # QA
  # main → build image → QA ECR → QA ECS
  # STATE_AWARE
  # ==========================================================

  build-push-qa:
    machine:
      image: ubuntu-2204:current

    steps:
      - checkout

      - configure-aws-oidc

      - login-to-ecr

      - run:
          name: Build and push QA image
          command: |

            IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${QA_ECR_REPOSITORY}"
            IMAGE_TAG="${CIRCLE_SHA1}-${CIRCLE_BUILD_NUM}"

            docker build \
              --tag "${IMAGE_URI}:${IMAGE_TAG}" \
              .

            docker push \
              "${IMAGE_URI}:${IMAGE_TAG}"

            echo "QA image:"
            echo "${IMAGE_URI}:${IMAGE_TAG}"

      - run-ecs-task:
          cluster: ecs-qa
          task-definition-family: qa-task-defintion
          ecr-repository-env-var: QA_ECR_REPOSITORY
          image-tag: ${CIRCLE_SHA1}-${CIRCLE_BUILD_NUM}
          subnet-ids: $SUBNET_IDS
          security-group-id: $SECURITY_GROUP_ID
          public-ip-status: $PUBLIC_IP_STATUS
          dbt-run-mode: STATE_AWARE


  # ==========================================================
  # UAT
  # RC tag → approval → build → UAT ECR → UAT ECS
  # STATE_AWARE
  # ==========================================================

  build-push-uat:
    machine:
      image: ubuntu-2204:current

    steps:
      - checkout

      - configure-aws-oidc

      - login-to-ecr

      - run:
          name: Build and push UAT image
          command: |

            IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${UAT_ECR_REPOSITORY}"
            IMAGE_TAG="${CIRCLE_TAG}-${CIRCLE_BUILD_NUM}"

            echo "Release: ${CIRCLE_TAG}"

            docker build \
              --tag "${IMAGE_URI}:${IMAGE_TAG}" \
              .

            docker push \
              "${IMAGE_URI}:${IMAGE_TAG}"

            echo "UAT image:"
            echo "${IMAGE_URI}:${IMAGE_TAG}"

      - run-ecs-task:
          cluster: ecs-uat
          task-definition-family: uat-task-definition
          ecr-repository-env-var: UAT_ECR_REPOSITORY
          image-tag: ${CIRCLE_TAG}-${CIRCLE_BUILD_NUM}
          subnet-ids: $SUBNET_IDS
          security-group-id: $SECURITY_GROUP_ID
          public-ip-status: $PUBLIC_IP_STATUS
          dbt-run-mode: STATE_AWARE


  # ==========================================================
  # PROD RELEASE
  # RC tag → approval → build → PROD ECR → PROD ECS
  # STATE_AWARE
  # ==========================================================

  build-push-prod:
    machine:
      image: ubuntu-2204:current

    steps:
      - checkout

      - configure-aws-oidc

      - login-to-ecr

      - run:
          name: Build and push PROD image
          command: |

            IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${PROD_ECR_REPOSITORY}"
            IMAGE_TAG="${CIRCLE_TAG}-${CIRCLE_BUILD_NUM}"

            echo "Release: ${CIRCLE_TAG}"

            docker build \
              --tag "${IMAGE_URI}:${IMAGE_TAG}" \
              .

            docker push \
              "${IMAGE_URI}:${IMAGE_TAG}"

            echo "PROD image:"
            echo "${IMAGE_URI}:${IMAGE_TAG}"

      - run-ecs-task:
          cluster: ecs-prod
          task-definition-family: prod-task-definition
          ecr-repository-env-var: PROD_ECR_REPOSITORY
          image-tag: ${CIRCLE_TAG}-${CIRCLE_BUILD_NUM}
          subnet-ids: $SUBNET_IDS
          security-group-id: $SECURITY_GROUP_ID
          public-ip-status: $PUBLIC_IP_STATUS
          dbt-run-mode: STATE_AWARE


  # ==========================================================
  # DAILY PROD
  # 02:00 UTC → PROD ECS → FULL DBT BUILD
  #
  # IMPORTANT:
  # - No checkout
  # - No Docker build
  # - No ECR push
  # - No previous manifest download
  # - No state comparison
  # - Uses existing PROD task definition
  # - DBT_RUN_MODE=FULL
  # - Updates manifest after successful build
  # ==========================================================

  run-prod-daily:
    machine:
      image: ubuntu-2204:current

    steps:

      - configure-aws-oidc

      - run:
          name: Run daily FULL dbt build on PROD ECS
          command: |

            echo "=========================================="
            echo "Daily PROD dbt Run"
            echo "=========================================="

            echo "Cluster:"
            echo "ecs-prod"

            echo "Task Definition:"
            echo "prod-task-definition"

            echo "DBT_RUN_MODE:"
            echo "FULL"

            # ------------------------------------------------
            # Run existing PROD task definition.
            #
            # ECS resolves prod-task-definition to the latest
            # ACTIVE revision.
            #
            # Only DBT_RUN_MODE is overridden for this run.
            # ------------------------------------------------

            TASK_ARN=$(aws ecs run-task \
              --cluster ecs-prod \
              --task-definition prod-task-definition \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_IDS],securityGroups=[$SECURITY_GROUP_ID],assignPublicIp=$PUBLIC_IP_STATUS}" \
              --overrides '{
                "containerOverrides": [
                  {
                    "name": "ecs-prod",
                    "environment": [
                      {
                        "name": "DBT_RUN_MODE",
                        "value": "FULL"
                      }
                    ]
                  }
                ]
              }' \
              --query 'tasks[0].taskArn' \
              --output text)

            if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
              echo "ERROR: ecs run-task did not return a task ARN"
              exit 1
            fi

            echo "Started PROD ECS task:"
            echo "${TASK_ARN}"

            # ------------------------------------------------
            # Wait for ECS task
            # ------------------------------------------------

            echo "Waiting for PROD ECS task to finish..."

            aws ecs wait tasks-stopped \
              --cluster ecs-prod \
              --tasks "$TASK_ARN"

            # ------------------------------------------------
            # Get container exit code
            # ------------------------------------------------

            EXIT_CODE=$(aws ecs describe-tasks \
              --cluster ecs-prod \
              --tasks "$TASK_ARN" \
              --query 'tasks[0].containers[0].exitCode' \
              --output text)

            echo "=========================================="
            echo "PROD dbt Exit Code: ${EXIT_CODE}"
            echo "=========================================="

            if [ "$EXIT_CODE" != "0" ]; then
              echo "ERROR: Daily PROD dbt execution failed."
              echo "Check ECS task and CloudWatch Logs."
              exit 1
            fi

            echo "Daily FULL PROD dbt execution completed successfully."


# ============================================================
# WORKFLOWS
# ============================================================

workflows:

  # ==========================================================
  # QA WORKFLOW
  # ==========================================================

  qa:
    jobs:

      - build-push-qa:
          context: us-dbt
          filters:
            branches:
              only:
                - main

            tags:
              ignore: /.*/


  # ==========================================================
  # RELEASE CANDIDATE WORKFLOW
  # ==========================================================

  release-candidate:
    jobs:

      - approve-uat:
          type: approval
          filters: &rc-tag-only
            branches:
              ignore: /.*/

            tags:
              only: /^v\d+\.\d+\.\d+-rc-\d+$/

      - build-push-uat:
          requires:
            - approve-uat

          context: us-dbt

          filters:
            <<: *rc-tag-only

      - approve-prod:
          type: approval

          requires:
            - build-push-uat

          filters:
            <<: *rc-tag-only

      - build-push-prod:
          requires:
            - approve-prod

          context: us-dbt

          filters:
            <<: *rc-tag-only


  # ==========================================================
  # DAILY PROD DBT WORKFLOW
  # ==========================================================
  #
  # Runs every day at:
  #
  #   02:00 UTC
  #   07:30 AM IST
  #
  # This workflow ONLY runs run-prod-daily.
  #
  # It does NOT:
  #   - Run QA
  #   - Run UAT
  #   - Build Docker image
  #   - Push to ECR
  #   - Create a release tag
  #   - Perform state comparison
  #
  # The ECS container receives:
  #
  #   DBT_RUN_MODE=FULL
  #
  # Therefore the container executes:
  #
  #   dbt build
  #
  # After successful execution, the container uploads the
  # newly generated manifest.json and replaces the existing
  # PROD manifest in S3.
  #
  # ==========================================================

  daily-prod:
    triggers:

      - schedule:
          cron: "0 2 * * *"

          filters:
            branches:
              only:
                - main

    jobs:

      - run-prod-daily:
          context: us-dbt