version: 2.1

orbs:
  aws-cli: circleci/aws-cli@5.2.0

# ============================================================
# REUSABLE COMMAND
# ============================================================

commands:
  configure-aws-oidc:
    steps:
      - aws-cli/setup:
          role_arn: $AWS_ROLE_ARN
          region: $AWS_REGION

      - run:
          name: Verify AWS Identity
          command: aws sts get-caller-identity

  login-to-ecr:
    steps:
      - run:
          name: Login to Amazon ECR
          command: |
            aws ecr get-login-password --region "$AWS_REGION" | \
            docker login \
              --username AWS \
              --password-stdin \
              "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

  run-ecs-task:
    parameters:
      cluster:
        type: string
      task-family:
        type: string
      repository:
        type: string
      tag:
        type: string

    steps:
      - run:
          name: Run ECS Task
          command: |

            IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/<< parameters.repository >>:<< parameters.tag >>"

            TASK_JSON=$(aws ecs describe-task-definition \
              --task-definition "<< parameters.task-family >>" \
              --query taskDefinition)

            NEW_TASK=$(echo "$TASK_JSON" | jq --arg IMAGE "$IMAGE_URI" '
              .containerDefinitions[0].image=$IMAGE |
              del(
                .taskDefinitionArn,
                .revision,
                .status,
                .registeredAt,
                .registeredBy,
                .requiresAttributes,
                .compatibilities
              )')

            TASK_ARN=$(aws ecs register-task-definition \
              --cli-input-json "$NEW_TASK" \
              --query taskDefinition.taskDefinitionArn \
              --output text)

            RUN_TASK=$(aws ecs run-task \
              --cluster "<< parameters.cluster >>" \
              --task-definition "$TASK_ARN" \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_IDS],securityGroups=[$SECURITY_GROUP_ID],assignPublicIp=$PUBLIC_IP_STATUS}" \
              --query tasks[0].taskArn \
              --output text)

            aws ecs wait tasks-stopped \
              --cluster "<< parameters.cluster >>" \
              --tasks "$RUN_TASK"

            EXIT_CODE=$(aws ecs describe-tasks \
              --cluster "<< parameters.cluster >>" \
              --tasks "$RUN_TASK" \
              --query 'tasks[0].containers[0].exitCode' \
              --output text)

            echo "Exit Code: $EXIT_CODE"

            if [ "$EXIT_CODE" != "0" ]; then
              exit 1
            fi

# ============================================================
# JOBS
# ============================================================

jobs:

  build-push-qa:
    machine:
      image: ubuntu-2204:current

    steps:
      - checkout
      - configure-aws-oidc
      - login-to-ecr

      - run:
          name: Install jq
          command: |
            sudo apt update
            sudo apt install -y jq

      - run:
          name: Build & Push QA Image
          command: |
            IMAGE_TAG="${CIRCLE_SHA1}-${CIRCLE_BUILD_NUM}"
            IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${QA_ECR_REPOSITORY}"

            docker build -t "$IMAGE_URI:$IMAGE_TAG" .
            docker push "$IMAGE_URI:$IMAGE_TAG"

      - run-ecs-task:
          cluster: ecs-qa
          task-family: qa-task-definition
          repository: dbt-athena-demo
          tag: ${CIRCLE_SHA1}-${CIRCLE_BUILD_NUM}

  build-push-uat:
    machine:
      image: ubuntu-2204:current

    steps:
      - checkout
      - configure-aws-oidc
      - login-to-ecr

      - run:
          name: Install jq
          command: |
            sudo apt update
            sudo apt install -y jq

      - run:
          name: Build & Push UAT Image
          command: |
            IMAGE_TAG="${CIRCLE_TAG}-${CIRCLE_BUILD_NUM}"
            IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${UAT_ECR_REPOSITORY}"

            docker build -t "$IMAGE_URI:$IMAGE_TAG" .
            docker push "$IMAGE_URI:$IMAGE_TAG"

      - run-ecs-task:
          cluster: ecs-uat
          task-family: uat-task-definition
          repository: ecr-uat
          tag: ${CIRCLE_TAG}-${CIRCLE_BUILD_NUM}

  build-push-prod:
    machine:
      image: ubuntu-2204:current

    steps:
      - checkout
      - configure-aws-oidc
      - login-to-ecr

      - run:
          name: Install jq
          command: |
            sudo apt update
            sudo apt install -y jq

      - run:
          name: Build & Push PROD Image
          command: |
            IMAGE_TAG="${CIRCLE_TAG}-${CIRCLE_BUILD_NUM}"
            IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${PROD_ECR_REPOSITORY}"

            docker build -t "$IMAGE_URI:$IMAGE_TAG" .
            docker push "$IMAGE_URI:$IMAGE_TAG"

      - run-ecs-task:
          cluster: ecs-prod
          task-family: prod-task-definition
          repository: ecr-prod
          tag: ${CIRCLE_TAG}-${CIRCLE_BUILD_NUM}

# ============================================================
# WORKFLOWS
# ============================================================

workflows:

  # ------------------------------------------------------------
  # QA (Automatic on merge to main)
  # ------------------------------------------------------------

  qa:
    jobs:
      - build-push-qa:
          context: us-dbt
          filters:
            branches:
              only: main
            tags:
              ignore: /.*/

  # ------------------------------------------------------------
  # Release Candidate
  # Trigger: Push tag like v1.0.0-rc-0
  # ------------------------------------------------------------

  release-candidate:
    jobs:

      - approve-uat:
          type: approval
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+-rc-\d+$/

      - build-push-uat:
          context: us-dbt
          requires:
            - approve-uat
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+-rc-\d+$/

      - approve-prod:
          type: approval
          requires:
            - build-push-uat
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+-rc-\d+$/

      - build-push-prod:
          context: us-dbt
          requires:
            - approve-prod
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+-rc-\d+$/