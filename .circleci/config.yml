version: 2.1

orbs:
  aws-cli: circleci/aws-cli@5.4.1

jobs:

  # =========================================================
  # FEATURE / PR VALIDATION
  #
  # feature → PR → CircleCI
  #
  # Runs:
  #   1. dbt dependencies
  #   2. dbt parse
  #   3. SQLFluff
  #
  # CI database:
  #   awsdatacatalog.practice
  # =========================================================

  validate-models:

    docker:
      - image: cimg/python:3.11

    environment:
      DBT_PROFILES_DIR: .

    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================

      - checkout

      # =====================================================
      # 2. VERIFY CHECKOUT
      # =====================================================

      - run:
          name: Verify Checkout and Commit
          command: |
            echo "========================================"
            echo "Current Branch"
            echo "========================================"

            git branch --show-current

            echo ""

            echo "========================================"
            echo "Current Commit"
            echo "========================================"

            git log -1 --oneline

            echo ""

            echo "========================================"
            echo "Git Status"
            echo "========================================"

            git status

      # =====================================================
      # 3. SHOW PROJECT FILES
      # =====================================================

      - run:
          name: Show Project Files
          command: |
            echo "========================================"
            echo "Project Files"
            echo "========================================"

            find . -maxdepth 3 -type f | sort

      # =====================================================
      # 4. INSTALL DEPENDENCIES
      # =====================================================

      - run:
          name: Install Dependencies
          command: |
            echo "========================================"
            echo "Python Version"
            echo "========================================"

            python --version

            echo ""

            echo "========================================"
            echo "Installing Dependencies"
            echo "========================================"

            pip install --upgrade pip

            pip install -r requirements.txt

            # YAML linter
            pip install yamllint

      # =====================================================
      # 5. VERIFY DBT
      # =====================================================

      - run:
          name: Verify dbt Installation
          command: |
            echo "========================================"
            echo "dbt Version"
            echo "========================================"

            dbt --version

      # =====================================================
      # 6. DBT DEPENDENCIES
      # =====================================================

      - run:
          name: dbt Dependencies
          command: |
            echo "========================================"
            echo "Running dbt deps"
            echo "========================================"

            dbt deps

      # =====================================================
      # 7. SHOW DBT CONFIGURATION
      # =====================================================

      - run:
          name: Show dbt Configuration
          command: |
            echo "========================================"
            echo "dbt Project"
            echo "========================================"

            cat dbt_project.yml

            echo ""

            echo "========================================"
            echo "dbt Profile"
            echo "========================================"

            cat profiles.yml

      # =====================================================
      # 8. DBT PARSE
      # =====================================================

      - run:
          name: dbt Parse
          command: |
            echo "========================================"
            echo "Running dbt parse"
            echo "========================================"

            dbt parse --no-partial-parse

      # =====================================================
      # 9. CHECK MODELS
      # =====================================================

      - run:
          name: Check dbt Models
          command: |
            echo "========================================"
            echo "Available dbt Models"
            echo "========================================"

            dbt ls \
              --resource-type model \
              --output name

      # =====================================================
      # 10. LINT PROJECT
      # =====================================================

      - run:
          name: SQL & YAML Linting
          command: |
            echo "========================================"
            echo "Running SQLFluff"
            echo "========================================"

            sqlfluff lint .

            echo ""

            echo "========================================"
            echo "Running Yamllint"
            echo "========================================"

            yamllint .

      # =====================================================
      # 11. AWS OIDC
      # =====================================================

      - aws-cli/setup:
          role_arn: "arn:aws:iam::008300323897:role/circle-ci-oidc-role"
          region: "ap-south-1"

      # =====================================================
      # 12. VERIFY AWS
      # =====================================================

      - run:
          name: Verify AWS Identity
          command: |
            echo "========================================"
            echo "AWS Identity"
            echo "========================================"

            aws sts get-caller-identity

  # =========================================================
  # MAIN DEPLOYMENT
  # =========================================================

  docker-build-push:

    docker:
      - image: cimg/base:stable

    resource_class: large

    steps:

      - checkout

      - setup_remote_docker

      - aws-cli/setup:
          role_arn: "arn:aws:iam::008300323897:role/circle-ci-oidc-role"
          region: "ap-south-1"

      - run:
          name: Verify AWS Identity
          command: |
            echo "========================================"
            echo "AWS Identity"
            echo "========================================"

            aws sts get-caller-identity

      - run:
          name: Login to Amazon ECR
          command: |
            echo "========================================"
            echo "Logging in to Amazon ECR"
            echo "========================================"

            aws ecr get-login-password --region ap-south-1 | \
              docker login \
              --username AWS \
              --password-stdin \
              008300323897.dkr.ecr.ap-south-1.amazonaws.com

      - run:
          name: Build Docker Image
          command: |
            echo "========================================"
            echo "Building Docker Image"
            echo "========================================"

            docker build \
              -t dbt-athena-demo:latest \
              .

      - run:
          name: Verify Docker Image
          command: |
            echo "========================================"
            echo "Docker Images"
            echo "========================================"

            docker images

      - run:
          name: Tag Docker Image
          command: |
            echo "========================================"
            echo "Tagging Docker Image"
            echo "========================================"

            docker tag \
              dbt-athena-demo:latest \
              008300323897.dkr.ecr.ap-south-1.amazonaws.com/dbt-athena-demo:latest

      - run:
          name: Push Docker Image to ECR
          command: |
            echo "========================================"
            echo "Pushing Docker Image to ECR"
            echo "========================================"

            docker push \
              008300323897.dkr.ecr.ap-south-1.amazonaws.com/dbt-athena-demo:latest

      - run:
          name: Verify ECR Image
          command: |
            echo "========================================"
            echo "Images in ECR"
            echo "========================================"

            aws ecr describe-images \
              --repository-name dbt-athena-demo \
              --region ap-south-1

      - run:
          name: Verify ECS Configuration
          command: |
            echo "========================================"
            echo "Checking ECS Configuration"
            echo "========================================"

            if [ -z "$ECS_CLUSTER" ]; then
              echo "ERROR: ECS_CLUSTER is not configured."
              exit 1
            fi

            if [ -z "$ECS_TASK_DEFINITION" ]; then
              echo "ERROR: ECS_TASK_DEFINITION is not configured."
              exit 1
            fi

            if [ -z "$ECS_SUBNET" ]; then
              echo "ERROR: ECS_SUBNET is not configured."
              exit 1
            fi

            if [ -z "$ECS_SECURITY_GROUP" ]; then
              echo "ERROR: ECS_SECURITY_GROUP is not configured."
              exit 1
            fi

            echo "ECS_CLUSTER: configured"
            echo "ECS_TASK_DEFINITION: configured"
            echo "ECS_SUBNET: configured"
            echo "ECS_SECURITY_GROUP: configured"

      - run:
          name: Verify ECS Cluster
          command: |
            echo "========================================"
            echo "Verifying ECS Cluster"
            echo "========================================"

            aws ecs describe-clusters \
              --clusters "$ECS_CLUSTER" \
              --region ap-south-1

      - run:
          name: Verify ECS Task Definition
          command: |
            echo "========================================"
            echo "Verifying ECS Task Definition"
            echo "========================================"

            aws ecs describe-task-definition \
              --task-definition "$ECS_TASK_DEFINITION" \
              --region ap-south-1

      - run:
          name: Run ECS Fargate Task
          command: |
            echo "========================================"
            echo "Starting ECS Fargate Task"
            echo "========================================"

            TASK_ARN=$(aws ecs run-task \
              --cluster "$ECS_CLUSTER" \
              --task-definition "$ECS_TASK_DEFINITION" \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[$ECS_SUBNET],securityGroups=[$ECS_SECURITY_GROUP],assignPublicIp=ENABLED}" \
              --started-by "circleci-${CIRCLE_WORKFLOW_ID}" \
              --query "tasks[0].taskArn" \
              --output text)

            if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
              echo "ERROR: ECS task failed to start."

              aws ecs run-task \
                --cluster "$ECS_CLUSTER" \
                --task-definition "$ECS_TASK_DEFINITION" \
                --launch-type FARGATE \
                --network-configuration "awsvpcConfiguration={subnets=[$ECS_SUBNET],securityGroups=[$ECS_SECURITY_GROUP],assignPublicIp=ENABLED}" \
                --started-by "circleci-${CIRCLE_WORKFLOW_ID}"

              exit 1
            fi

            echo "ECS Task started:"
            echo "$TASK_ARN"

            echo "$TASK_ARN" > /tmp/task_arn

      - run:
          name: Wait for ECS Task to Stop
          command: |
            echo "========================================"
            echo "Waiting for dbt ECS Task"
            echo "========================================"

            TASK_ARN=$(cat /tmp/task_arn)

            echo "Task ARN:"
            echo "$TASK_ARN"

            aws ecs wait tasks-stopped \
              --cluster "$ECS_CLUSTER" \
              --tasks "$TASK_ARN"

            echo ""

            echo "========================================"
            echo "ECS Task Has Stopped"
            echo "========================================"

      - run:
          name: Check dbt Task Result
          command: |
            echo "========================================"
            echo "Checking dbt Task Result"
            echo "========================================"

            TASK_ARN=$(cat /tmp/task_arn)

            EXIT_CODE=$(aws ecs describe-tasks \
              --cluster "$ECS_CLUSTER" \
              --tasks "$TASK_ARN" \
              --query "tasks[0].containers[0].exitCode" \
              --output text)

            echo "dbt container exit code: $EXIT_CODE"

            if [ "$EXIT_CODE" != "0" ]; then

              echo "========================================"
              echo "ERROR: dbt task failed"
              echo "========================================"

              aws ecs describe-tasks \
                --cluster "$ECS_CLUSTER" \
                --tasks "$TASK_ARN"

              exit 1

            fi

            echo "========================================"
            echo "dbt task completed successfully"
            echo "========================================"

# ===========================================================
# WORKFLOWS
# ===========================================================

workflows:

  feature-validation:

    jobs:

      - validate-models:
          filters:
            branches:
              ignore:
                - main

  deploy:

    jobs:

      - docker-build-push:
          filters:
            branches:
              only:
                - main